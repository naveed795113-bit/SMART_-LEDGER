name: Deploy SmartLedger to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Bundle offline spreadsheet and invoice libraries
        run: |
          mkdir -p vendor
          curl -fL --retry 3 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js' -o vendor/xlsx.full.min.js
          curl -fL --retry 3 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js' -o vendor/html2canvas.min.js
          curl -fL --retry 3 'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js' -o vendor/jspdf.umd.min.js
          sed -i 's#https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js#./vendor/xlsx.full.min.js#g; s#https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js#./vendor/html2canvas.min.js#g; s#https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js#./vendor/jspdf.umd.min.js#g' index.html
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for artifact registration
        run: sleep 15
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          reporting_interval: 10000

# Fresh deployment run after duplicate artifacts from the manual job retry.
