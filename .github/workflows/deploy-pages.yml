name: Deploy SmartLedger to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for artifact registration
        run: sleep 15
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          reporting_interval: 10000

# Redeploy current main branch after the phone-login validation fix. Retry 2.
