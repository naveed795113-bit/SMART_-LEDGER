name: Build SmartLedger Android APK

concurrency:
  group: smartledger-android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - '*.webmanifest'
      - 'icon.svg'
      - 'android/**'
      - 'tests/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SmartLedger source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install DOM test dependency
        run: npm install --no-save jsdom@26

      - name: Validate JavaScript syntax and authentication isolation
        run: |
          node --check smartledger-enhancements-v67.js
          node --check offline-ocr-v69.js
          node --input-type=module --check < login-gate-v50.js
          node --check accounting.js
          node --check business-suite-v40.js
          node --check google-drive-v49.js
          node --check theme-v45-contrast.js
          node --check theme-v46-complete-contrast.js
          node --check theme-v48-more-theme.js
          node tests/account-storage-auth.mjs

      - name: Run full application regression tests
        run: |
          node tests/v11-smoke.mjs
          node tests/v11-runtime.mjs
          node tests/v18-accounting.mjs
          node tests/v40-business-suite.mjs
          node tests/returns-accounting.mjs
          node tests/return-journals.mjs
          node tests/offline-ocr.mjs
          node tests/whatsapp-share.mjs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build Tesseract4Android native OCR library
        shell: bash
        run: |
          git clone --depth 1 --recurse-submodules --branch 4.9.0 https://github.com/adaptech-cz/Tesseract4Android.git /tmp/Tesseract4Android
          JITPACK=true gradle --no-daemon --no-configuration-cache -p /tmp/Tesseract4Android :tesseract4android:assembleOpenmpRelease
          mkdir -p android/app/libs
          OCR_AAR="$(find /tmp/Tesseract4Android/tesseract4android/build/outputs/aar -maxdepth 1 -type f -name '*openmp*release*.aar' -print -quit)"
          test -n "$OCR_AAR"
          cp "$OCR_AAR" android/app/libs/tesseract4android-openmp-release.aar
          test -s android/app/libs/tesseract4android-openmp-release.aar

      - name: Bundle the complete offline web app
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/www/vendor
          rsync -a --exclude='.git' --exclude='.github' --exclude='android' --exclude='node_modules' --exclude='tests' --exclude='package.json' --exclude='package-lock.json' --exclude='README.md' --exclude='*.md' ./ android/app/src/main/assets/www/
          curl -fL 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js' -o android/app/src/main/assets/www/vendor/xlsx.full.min.js
          curl -fL 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js' -o android/app/src/main/assets/www/vendor/html2canvas.min.js
          curl -fL 'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js' -o android/app/src/main/assets/www/vendor/jspdf.umd.min.js
          mkdir -p android/app/src/main/assets/tessdata android/app/src/main/assets/ocr_licenses
          OCR_DATA_COMMIT=e12c65a915945e4c28e237a9b52bc4a8f39a0cec
          for lang in eng hin urd; do
            curl -fL "https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/$OCR_DATA_COMMIT/$lang.traineddata" -o "android/app/src/main/assets/tessdata/$lang.traineddata"
          done
          curl -fL "https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/$OCR_DATA_COMMIT/LICENSE" -o android/app/src/main/assets/ocr_licenses/tessdata_best-LICENSE.txt
          curl -fL "https://raw.githubusercontent.com/adaptech-cz/Tesseract4Android/4.9.0/LICENSE" -o android/app/src/main/assets/ocr_licenses/Tesseract4Android-LICENSE.txt
          sed -i 's#https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js#./vendor/xlsx.full.min.js#g' android/app/src/main/assets/www/index.html
          sed -i 's#https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js#./vendor/html2canvas.min.js#g' android/app/src/main/assets/www/index.html
          sed -i 's#https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js#./vendor/jspdf.umd.min.js#g' android/app/src/main/assets/www/index.html

      - name: Verify bundled offline app resources
        shell: bash
        run: |
          test -s android/app/src/main/assets/www/index.html
          test -s android/app/src/main/assets/www/accounting.js
          test -s android/app/src/main/assets/www/business-suite-v40.js
          test -s android/app/src/main/assets/www/login-gate-v50.js
          test -s android/app/src/main/assets/www/vendor/xlsx.full.min.js
          test -s android/app/src/main/assets/www/vendor/html2canvas.min.js
          test -s android/app/src/main/assets/www/vendor/jspdf.umd.min.js
          test -s android/app/libs/tesseract4android-openmp-release.aar
          test -s android/app/src/main/assets/tessdata/eng.traineddata
          test -s android/app/src/main/assets/tessdata/hin.traineddata
          test -s android/app/src/main/assets/tessdata/urd.traineddata
          test -s android/app/src/main/assets/ocr_licenses/tessdata_best-LICENSE.txt
          test -s android/app/src/main/assets/ocr_licenses/Tesseract4Android-LICENSE.txt
          test "$(stat -c%s android/app/src/main/assets/tessdata/eng.traineddata)" -gt 10000000
          test "$(stat -c%s android/app/src/main/assets/tessdata/hin.traineddata)" -gt 8000000
          test "$(stat -c%s android/app/src/main/assets/tessdata/urd.traineddata)" -gt 6000000
          du -h android/app/src/main/assets/tessdata/*
          if grep -E 'https://cdn.jsdelivr.net/npm/(xlsx|html2canvas|jspdf)' android/app/src/main/assets/www/index.html; then
            echo 'External CDN dependency remains in native app bundle' >&2
            exit 1
          fi

      - name: Prepare release signing key (when configured)
        if: ${{ secrets.SMARTLEDGER_KEYSTORE_BASE64 != '' }}
        env:
          SMARTLEDGER_KEYSTORE_BASE64: ${{ secrets.SMARTLEDGER_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          echo "$SMARTLEDGER_KEYSTORE_BASE64" | base64 --decode > android/keystore/smartledger-release.jks
          test -s android/keystore/smartledger-release.jks

      - name: Build debug and release APKs
        env:
          SMARTLEDGER_KEYSTORE_PATH: ${{ secrets.SMARTLEDGER_KEYSTORE_BASE64 != '' && 'keystore/smartledger-release.jks' || '' }}
          SMARTLEDGER_STORE_PASSWORD: ${{ secrets.SMARTLEDGER_STORE_PASSWORD }}
          SMARTLEDGER_KEY_ALIAS: ${{ secrets.SMARTLEDGER_KEY_ALIAS }}
          SMARTLEDGER_KEY_PASSWORD: ${{ secrets.SMARTLEDGER_KEY_PASSWORD }}
        run: |
          gradle --no-daemon -p android assembleDebug assembleRelease

      - name: Verify APK outputs
        shell: bash
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/apk/release/app-release.apk || test -s android/app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/tessdata/eng.traineddata'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/tessdata/hin.traineddata'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/tessdata/urd.traineddata'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libtesseract.so'
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/SmartLedger-v69.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk apk-output/SmartLedger-v69-release-signed.apk
            apksigner verify --verbose apk-output/SmartLedger-v69-release-signed.apk
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk apk-output/SmartLedger-v69-release-unsigned.apk
            echo "Release keystore secrets are not configured; unsigned release retained."
          fi
          ls -lh apk-output/

      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: SmartLedger-Android-APK-v69
          path: |
            apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare Android emulator tools and AVD
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64"
          printf 'no\n' | "$AVDMANAGER" create avd --force --name test --package "system-images;android-35;google_apis;x86_64" --device "pixel_2"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/emulator/emulator"
          test -f "$ANDROID_AVD_HOME/test.ini"
          test -d "$ANDROID_AVD_HOME/test.avd"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx test

      - name: Run offline OCR and invoice sharing tests on Android emulator
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          test -f "$ANDROID_AVD_HOME/test.ini"
          emulator -list-avds | grep -Fx test
          adb start-server
          emulator -port 5554 -avd test -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim &
          EMULATOR_PID=$!
          cleanup() {
            adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
            wait "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          adb -s emulator-5554 wait-for-device
          for attempt in $(seq 1 300); do
            BOOTED="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$BOOTED" = "1" ]; then
              break
            fi
            if [ "$attempt" -eq 300 ]; then
              echo "Android emulator failed to boot within 10 minutes" >&2
              exit 1
            fi
            sleep 2
          done
          adb -s emulator-5554 shell input keyevent 82
          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
          timeout --signal=TERM --kill-after=30s 8m gradle --no-daemon -p android connectedDebugAndroidTest --stacktrace
          RESULT_DIR="android/app/build/outputs/androidTest-results/connected"
          if [ ! -d "$RESULT_DIR" ] || ! find "$RESULT_DIR" -name '*.xml' -type f -print -quit | grep -q .; then
            echo "Android instrumentation test result XML files were not generated" >&2
            exit 1
          fi
          if grep -R -E '<failure|<error' "$RESULT_DIR" --include='*.xml'; then
            echo "Android instrumentation tests reported failures" >&2
            exit 1
          fi
          echo "Android emulator instrumentation tests passed; XML results verified."
