name: SmartLedger v40.0 validation
on:
  push:
    branches: [release/smartledger-v40-unified-business-suite]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browserless DOM test dependency
        run: npm install --no-save jsdom@26
      - name: Validate application structure and syntax
        run: node tests/v11-smoke.mjs
      - name: Run application interaction smoke tests
        run: node tests/v11-runtime.mjs
      - name: Check accounting module syntax
        run: node --check accounting.js
      - name: Run v18 accounting journal tests
        run: node tests/v18-accounting.mjs
      - name: Check v40 business suite syntax
        run: node --check business-suite-v40.js
      - name: Run v40 business suite tests
        run: node tests/v40-business-suite.mjs
