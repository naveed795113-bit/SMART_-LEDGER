name: SmartLedger v11.0 validation
on:
  push:
    branches: [release/smartledger-v11.0]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate application
        run: node tests/v11-smoke.mjs
