name: SmartLedger v40.0 validation
on:
  push:
    branches: [release/smartledger-v40-unified-business-suite]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browserless DOM test dependency
        run: npm install --no-save jsdom@26
      - name: Check v67 enhancement module syntax
        run: node --check smartledger-enhancements-v67.js
      - name: Check v69 invoice and transaction workflow syntax
        run: node --check smartledger-workflow-v69.js
      - name: Test v69 invoice sharing and transaction form usability
        run: node tests/v69-workflow.mjs
      - name: Check v70 transaction contact persistence syntax
        run: node --check smartledger-workflow-v70.js
      - name: Test v70 transaction contact persistence
        run: node tests/v70-contact-persistence.mjs
      - name: Test Firebase auth persistence with account isolation
        run: node tests/account-storage-auth.mjs
      - name: Validate application structure and syntax
        run: node tests/v11-smoke.mjs
      - name: Run application interaction smoke tests
        run: node tests/v11-runtime.mjs
      - name: Check theme contrast runtime syntax
        run: node --check theme-v45-contrast.js
      - name: Check complete element-level contrast runtime
        run: node --check theme-v46-complete-contrast.js
      - name: Check v48 More workspace theme syntax
        run: node --check theme-v48-more-theme.js
      - name: Check Google Drive integration syntax
        run: node --check google-drive-v49.js
      - name: Check mandatory login screen syntax
        run: node --input-type=module --check < login-gate-v50.js
      - name: Check accounting module syntax
        run: node --check accounting.js
      - name: Run v18 accounting journal tests
        run: node tests/v18-accounting.mjs
      - name: Check v40 business suite syntax
        run: node --check business-suite-v40.js
      - name: Run v40 business suite tests
        run: node tests/v40-business-suite.mjs
