name: SmartLedger Units & Conversions
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "units-conversions-v1.js"
      - "tests/units-conversions.mjs"
      - ".github/workflows/units-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "units-conversions-v1.js"
      - "tests/units-conversions.mjs"
      - ".github/workflows/units-validation.yml"
jobs:
  units-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install DOM test dependency
        run: npm install --no-save jsdom@26
      - name: Check unit manager syntax
        run: node --check units-conversions-v1.js
      - name: Test unit master, inventory, sales and purchase conversions
        run: node tests/units-conversions.mjs
      - name: Run existing transaction regression tests
        run: node tests/v40-business-suite.mjs
      - name: Run enterprise workflow regression tests
        run: node tests/v78-enterprise.mjs
