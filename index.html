 /* Professional ledger-style lists */.tablewrap table{border-spacing:0}.tablewrap th,.tablewrap td{border-right:1px solid #cdbbb5;border-bottom:1px solid #d8c9c3}.tablewrap th:last-child,.tablewrap td:last-child{border-right:1px solid #cdbbb5}.tablewrap thead th{position:sticky;top:0;z-index:1}.tablewrap tbody tr:last-child td{border-bottom:1px solid #d8c9c3}@media(max-width:600px){.tablewrap th,.tablewrap td{padding:9px 10px;font-size:12px}}</style></head><body><div class="app"><aside class="side"><div class="brand">◈ SmartLedger<small>BUSINESS MANAGER</small></div><nav class="nav" id="nav"><div class="navlabel">Workspace</div><button class="active" data-page="Dashboard">▦ <span class="txt">Dashboard</span></button><button data-page="Sales">▤ <span class="txt">Sales</span></button><button data-page="Purchases">▣ <span class="txt">Purchases</span></button><button data-page="Items">▧ <span class="txt">Items & Stock</span></button><div class="navlabel">People</div><button data-page="Customers">♙ <span class="txt">Customers</span></button><button data-page="Suppliers">♧ <span class="txt">Suppliers</span></button><button data-page="Expenses">₹ <span class="txt">Expenses</span></button><div class="navlabel">Accounts</div><button data-page="Cash & Bank">▤ <span class="txt">Cash & Bank</span></button><button data-page="Ledgers">⇄ <span class="txt">Ledgers & Payments</span></button><button data-page="Stock Alerts">⚑ <span class="txt">Stock Alerts</span></button><button data-page="Tax Reports">▥ <span class="txt">GST Reports</span></button><button data-page="Reports">▥ <span class="txt">Reports</span></button><button data-page="Settings">⚙ <span class="txt">Settings</span></button></nav></aside><main class="main"><header class="top"><strong id="pagetitle">Dashboard</strong><div class="topright"><span class="pill">✦ SMARTLEDGER PRO</span><button class="btn soft" onclick="cycleTheme()">◐ Appearance</button><span id="today" class="muted"></span></div></header><div class="content" id="view"></div></main></div><nav class="mobile-nav" id="mobileNav" aria-label="Main navigation"><button class="active" data-page="Dashboard"><span class="mi">⌂</span>Home</button><button data-page="Sales"><span class="mi">▤</span>Sales</button><button data-page="Purchases"><span class="mi">🛒</span>Purchase</button><button data-page="Items"><span class="mi">▦</span>Items</button><button data-page="More"><span class="mi">☰</span>More</button></nav><div class="modal" id="modal"><div class="dialog"><div class="dialoghead"><h2 id="modaltitle">Add</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalbody"></div></div></div><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
const $=s=>document.querySelector(s), money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2}), db={items:'sl_items',customers:'sl_customers',suppliers:'sl_suppliers',sales:'sl_sales',purchases:'sl_purchases',expenses:'sl_expenses',cash:'sl_cash',payments:'sl_payments',adjustments:'sl_adjustments'};
const get=k=>JSON.parse(localStorage.getItem(db[k])||'[]'), put=(k,v)=>localStorage.setItem(db[k],JSON.stringify(v)), num=v=>Number(v)||0, sum=(a,f)=>a.reduce((s,x)=>s+num(f(x)),0), today=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
$('#today').textContent=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
const iconSvg=(name)=>{const paths={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',sales:'<path d="M7 3h10l4 4v14H7z"/><path d="M17 3v5h4M10 13h8M10 17h8"/>',purchase:'<path d="M3 4h2l2.2 11.5a2 2 0 0 0 2 1.5h8.6a2 2 0 0 0 1.9-1.4L22 9H6"/><circle cx="10" cy="21" r="1"/><circle cx="18" cy="21" r="1"/>',items:'<path d="m12 3 9 5-9 5-9-5z"/><path d="M3 8v9l9 5 9-5V8M12 13v9"/>',people:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5v1"/>',expense:'<path d="M12 2v20M17 6H9a3 3 0 0 0 0 6h6a3 3 0 0 1 0 6H6"/>',cash:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M12 12v1"/>',ledger:'<path d="M4 7h15M15 3l4 4-4 4M20 17H5m4-4-4 4 4 4"/>',alert:'<path d="M12 3 22 20H2z"/><path d="M12 9v4m0 3h.01"/>',report:'<path d="M4 20V4m0 16h17M8 16v-5m5 5V7m5 9v-8"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 2z"/>',more:'<path d="M4 6h16M4 12h16M4 18h16"/>'};return '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(paths[name]||paths.items)+'</svg>'};
function applyNavIcons(){let map={'Dashboard':'home','Sales':'sales','Purchases':'purchase','Items':'items','Customers':'people','Suppliers':'people','Expenses':'expense','Cash & Bank':'cash','Ledgers':'ledger','Stock Alerts':'alert','Tax Reports':'report','Reports':'report','Settings':'settings'};document.querySelectorAll('#nav button[data-page]').forEach(b=>{let key=b.dataset.page,txt=b.querySelector('.txt');if(txt){b.firstChild.textContent='';let holder=document.createElement('span');holder.className='nav-icon';holder.innerHTML=iconSvg(map[key]);b.insertBefore(holder,txt)}});document.querySelectorAll('#mobileNav button[data-page]').forEach(b=>{let key=b.dataset.page==='Dashboard'?'home':b.dataset.page==='Sales'?'sales':b.dataset.page==='Purchases'?'purchase':b.dataset.page==='Items'?'items':'more',mi=b.querySelector('.mi');if(mi)mi.innerHTML=iconSvg(key)})}
let page='Dashboard';
function totals(){let s=get('sales'),p=get('purchases'),e=get('expenses');return {sales:sum(s,x=>x.total),purchases:sum(p,x=>x.total),expenses:sum(e,x=>x.amount),received:sum(s,x=>x.paid),paid:sum(p,x=>x.paid),stock:sum(get('items'),x=>x.qty*x.purchase),profit:sum(s,x=>(x.taxable??x.total)-x.cost)-sum(e,x=>x.amount)}}
function go(p){page=p;$('#pagetitle').textContent=p==='More'?'More':p;document.querySelectorAll('.nav button,.mobile-nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p||(b.dataset.page==='More'&&['Customers','Suppliers','Expenses','Cash & Bank','Ledgers','Stock Alerts','Tax Reports','Reports','Settings'].includes(p))));render()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});$('#mobileNav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
function render(){let t=totals(),v=$('#view');if(page==='Dashboard'){v.innerHTML=`<div class="welcome"><div><h1>Business overview</h1><div class="muted">Your business at a glance</div></div><div class="actions"><button class="btn" onclick="exportData()">↓ Backup</button><button class="btn primary" onclick="saleForm()">＋ New Sale</button></div></div><div class="grid"><div class="card"><div class="statlabel">Total Sales</div><div class="stat">${money(t.sales)}</div><div class="muted">All recorded invoices</div></div><div class="card"><div class="statlabel">Total Purchases</div><div class="stat">${money(t.purchases)}</div><div class="muted">All recorded purchases</div></div><div class="card"><div class="statlabel">Expenses</div><div class="stat">${money(t.expenses)}</div><div class="muted">Business expenses</div></div><div class="card"><div class="statlabel">Estimated Net Profit</div><div class="stat ${t.profit>=0?'positive':'negative'}">${money(t.profit)}</div><div class="muted">Sales gross margin less expenses</div></div><div class="card"><div class="statlabel">Customer Receivables</div><div class="stat">${money(outstandingTotal('Customer'))}</div></div><div class="card"><div class="statlabel">Supplier Payables</div><div class="stat">${money(outstandingTotal('Supplier'))}</div></div><div class="card"><div class="statlabel">Stock Valuation</div><div class="stat">${money(t.stock)}</div></div><div class="card"><div class="statlabel">Cash Received</div><div class="stat">${money(t.received)}</div></div></div>${chartsSection()}<div class="section"><div class="sectionhead"><h2>Quick actions</h2></div><div class="quick"><button onclick="saleForm()">＋ Create Sale<span>Tax / retail invoice</span></button><button onclick="purchaseForm()">＋ Add Purchase<span>Record supplier stock</span></button><button onclick="itemForm()">▧ Add Item<span>Manage inventory</span></button><button onclick="partyForm('customers')">♙ Add Customer<span>Manage parties</span></button></div></div><div class="section"><div class="sectionhead"><h2>Recent sales</h2><button class="btn soft" onclick="go('Sales')">View all</button></div>${table(get('sales').slice(-5).reverse(),[['date','Date'],['invoice','Invoice'],['party','Customer'],['total','Amount']],true)}</div>`;}else if(page==='Items')listItems();else if(page==='Customers'||page==='Suppliers')listParties(page.toLowerCase());else if(page==='Sales')listTransactions('sales');else if(page==='Purchases')listTransactions('purchases');else if(page==='Expenses')listExpenses();else if(page==='Reports')reports();else if(page==='Cash & Bank')cashPage();else if(page==='Ledgers')ledgerPage();else if(page==='Stock Alerts')stockAlerts();else if(page==='Stock Summary')stockSummary();else if(page==='Tax Reports')taxReports();else if(page==='Settings')settings();else if(page==='More')morePage(); addSectionQuickLinks(); }

function parseCSVRows(t){let rows=[],row=[],cell='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell.trim());cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell.trim());if(row.some(v=>v!==''))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell.trim());if(row.some(v=>v!==''))rows.push(row);return rows}
function saveBulkItems(){let f=$('#bulkfile')?.files?.[0];if(!f)return alert('Choose a spreadsheet file first');let ext=f.name.split('.').pop().toLowerCase();if(!['xls','xlsx','csv'].includes(ext))return alert('Choose .xls, .xlsx or .csv');let rd=new FileReader();rd.onerror=()=>alert('Could not read file');rd.onload=()=>{try{let rows;if(ext==='csv')rows=parseCSVRows(String(rd.result||''));else{if(!window.XLSX)throw Error('Excel reader did not load. Connect to the internet and reopen the app, or save as CSV.');let wb=XLSX.read(rd.result,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}if(!rows.length)throw Error('The selected sheet is empty');let h=rows[0].map(x=>String(x||'').toLowerCase());if(h.some(x=>/item name|sku|barcode|quantity|purchase price/.test(x)))rows.shift();let a=get('items'),added=0,skipped=0;rows.forEach(c=>{let name=String(c[0]??'').trim(),code=String(c[1]??'').trim(),qty=num(c[2]),unit=String(c[3]||'pcs'),purchase=num(c[4]),price=num(c[5]),wholesale=num(c[6]),gst=num(c[7]),minStock=c[8]===undefined||c[8]===''?5:num(c[8]);if(!name||a.some(x=>String(x.name).toLowerCase()===name.toLowerCase()||(code&&String(x.code||'').toLowerCase()===code.toLowerCase()))||qty<0||purchase<0||price<0||wholesale<0||gst<0){skipped++;return}a.push({name,code,qty,unit,purchase,price,wholesale,gst,minStock});added++});if(!added)throw Error('No valid new items found. Check column order and duplicate names / SKUs.');put('items',a);closeModal();render();alert(added+' items imported; '+skipped+' rows skipped.')}catch(e){alert(e.message||'Import failed')}};ext==='csv'?rd.readAsText(f):rd.readAsArrayBuffer(f)}
function chartsSection(){let rows=[...get('sales').map(x=>({date:x.date,type:'Sales',amount:x.total})),...get('purchases').map(x=>({date:x.date,type:'Purchases',amount:x.total})),...get('expenses').map(x=>({date:x.date,type:'Expenses',amount:x.amount}))],g={};rows.forEach(x=>{let m=(x.date||today).slice(0,7);g[m]??={Sales:0,Purchases:0,Expenses:0};g[m][x.type]+=num(x.amount)});let months=Object.keys(g).sort(),max=Math.max(1,...months.flatMap(m=>[g[m].Sales,g[m].Purchases,g[m].Expenses])),bars=months.slice(-12).map(m=>'<div class="chart-col"><i title="Sales '+money(g[m].Sales)+'" style="height:'+Math.max(3,g[m].Sales/max*100)+'%"></i><i title="Purchases '+money(g[m].Purchases)+'" style="height:'+Math.max(3,g[m].Purchases/max*100)+'%;background:#b58a58"></i><i title="Expenses '+money(g[m].Expenses)+'" style="height:'+Math.max(3,g[m].Expenses/max*100)+'%;background:#8d7b8b"></i><small>'+m+'</small></div>').join(''),detail=months.map(m=>'<tr><td>'+m+'</td><td>'+money(g[m].Sales)+'</td><td>'+money(g[m].Purchases)+'</td><td>'+money(g[m].Expenses)+'</td><td>'+money(g[m].Sales-g[m].Expenses)+'</td></tr>').join('');return '<details class="section card chart-details"><summary style="cursor:pointer;font-weight:750;font-size:16px">Business performance · Open charts and monthly details</summary><p class="muted">Monthly sales, purchases, expenses and operating movement. All recorded months are listed.</p><div class="chart-bars">'+(bars||'<p class="empty">No transactions to chart yet.</p>')+'</div><div class="tablewrap" style="margin-top:16px"><table><thead><tr><th>Month</th><th>Sales</th><th>Purchases</th><th>Expenses</th><th>Sales less expenses*</th></tr></thead><tbody>'+(detail||'<tr><td colspan="5" class="empty">No monthly records yet</td></tr>')+'</tbody></table></div><p class="muted">*Movement indicator only, not net profit. Use Reports for cost-based profit estimates.</p></details>'}
function askBusinessAssistant(){let q=String($('#aiquestion')?.value||'').trim().toLowerCase(),sales=get('sales'),purchases=get('purchases'),items=get('items'),customers=get('customers'),low=items.filter(x=>num(x.qty)<=num(x.minStock??5)),month=sales.filter(x=>(x.date||'').slice(0,7)===today.slice(0,7)),day=sales.filter(x=>x.date===today),best=[...customers].map(c=>({name:c.name,total:sum(sales.filter(x=>x.party===c.name),x=>x.total)})).sort((a,b)=>b.total-a.total).slice(0,5),productSales={};sales.forEach(x=>(x.lines||[{item:x.item,qty:x.qty,total:x.total}]).forEach(l=>{let k=l.item||'Unspecified';productSales[k]=(productSales[k]||0)+num(l.qty)}));let topItems=Object.entries(productSales).sort((a,b)=>b[1]-a[1]).slice(0,5),gross=sales.reduce((z,x)=>z+num(x.taxable??x.total)-num(x.cost),0),missing=sales.filter(x=>!num(x.cost)).length,answer='Try: today sales, this month sales, profit, low stock, top selling items, top customers, stock value, customer due or supplier due.';if(/today|today sales/.test(q))answer='Today sales: '+money(sum(day,x=>x.total))+' across '+day.length+' invoices.';else if(/low stock|reorder|shortage/.test(q))answer=low.length?'Reorder attention ('+low.length+' items): '+low.slice(0,20).map(x=>x.name+' — '+x.qty+' '+(x.unit||'pcs')+' left; reorder at '+num(x.minStock??5)).join('; '):'No items are currently at or below their reorder level.';else if(/this month|monthly sales|sales this month/.test(q))answer='Sales this month: '+money(sum(month,x=>x.total))+' across '+month.length+' invoices. Purchases this month: '+money(sum(purchases.filter(x=>(x.date||'').slice(0,7)===today.slice(0,7)),x=>x.total))+'.';else if(/profit|margin/.test(q))answer='Recorded gross profit estimate: '+money(gross)+'. Estimated net after recorded expenses: '+money(gross-sum(get('expenses'),x=>x.amount))+'. '+missing+' sales have no recorded cost; missing costs/opening stock can make this incomplete.';else if(/receivable|customer due|customer balance/.test(q))answer='Customer function openAIAssistant(){let items=get('items'),low=items.filter(x=>num(x.qty)<=num(x.minStock));modal('SmartLedger Business Assistant','<div class="card"><b>Business data assistant</b><p class="muted">Ask practical business questions. It analyses sales, profit estimates, fast-moving products, reorder needs, customer balances and supplier dues using saved records. No cloud AI model is connected.</p><div class="field"><label>Your question</label><input id="aiquestion" placeholder="Which items are low in stock?" onkeydown="if(event.key===\'Enter\')askBusinessAssistant()"></div><button class="btn primary" style="margin-top:10px" onclick="askBusinessAssistant()">Analyse business</button><div id="aianswer" style="margin-top:12px"></div></div><div class="section"><b>Current business signals</b><div class="grid"><div class="card"><div class="statlabel">Low-stock items</div><div class="stat">'+low.length+'</div></div><div class="card"><div class="statlabel">This month sales</div><div class="stat">'+money(sum(get('sales').filter(x=>(x.date||'').slice(0,7)===today.slice(0,7)),x=>x.total))+'</div></div><div class="card"><div class="statlabel">Customer due</div><div class="stat">'+money(outstandingTotal('Customer'))+'</div></div><div class="card"><div class="statlabel">Supplier due</div><div class="stat">'+money(outstandingTotal('Supplier'))+'</div></div></div></div><div class="actions"><button class="btn" onclick="closeModal();go(\'Stock Alerts\')">Stock alerts</button><button class="btn" onclick="closeModal();go(\'Reports\')">Reports</button><button class="btn" onclick="closeModal();go(\'Ledgers\')">Ledgers</button></div>')}

function itemForm(){modal('Add inventory item','<form onsubmit="saveItem(event)"><div class="formgrid">'+field('Item name','iname')+field('SKU / Barcode','icode')+field('Opening stock','iqty','number','step="any" value="0"')+field('Low-stock alert at','imin','number','step="any" value="5"')+field('Unit','iunit')+field('Purchase price (₹)','ipurchase','number','step="any" value="0"')+field('Retail sale price (₹)','iprice','number','step="any" value="0"')+field('Wholesale price (₹)','iwholesale','number','step="any" value="0"')+'<div class="field"><label>GST rate</label><select id="igst"><option value="0">Exempt / 0%</option><option value="5">5%</option><option value="12">12%</option><option value="18">18%</option><option value="28">28%</option></select></div></div><p><button class="btn primary">Save item</button></p></form>')}
function saveItem(e){e.preventDefault();let a=get('items'),name=$('#iname').value.trim(),code=$('#icode').value.trim(),qty=num($('#iqty').value),purchase=num($('#ipurchase').value),price=num($('#iprice').value),wholesale=num($('#iwholesale').value),minStock=num($('#imin').value);if(!name)return alert('Enter an item name');if(a.some(x=>x.name.toLowerCase()===name.toLowerCase()))return alert('An item with this name already exists');if(code&&a.some(x=>String(x.code||'').toLowerCase()===code.toLowerCase()))return alert('This SKU / barcode is already in use');if(qty<0||purchase<0||price<0||wholesale<0||minStock<0)return alert('Stock and prices cannot be negative');a.push({name,code,qty,unit:$('#iunit').value||'pcs',purchase,price,wholesale,gst:num($('#igst').value),minStock});put('items',a);closeModal();render()}

function transactionForm(k){let sales=k==='sales',items=get('items'),parties=get(sales?'customers':'suppliers');modal(sales?'New sale invoice':'New purchase bill','<form onsubmit="saveTransaction(event,\''+k+'\')"><div class="formgrid">'+field('Date','tdate','date','value="'+today+'"')+field('Invoice / bill number','tinvoice','text','value="'+(sales?'SL-':'PB-')+Date.now().toString().slice(-6)+'"')+'<div class="field"><label>'+(sales?'Customer':'Supplier')+'</label><select id="tparty"><option>Walk-in</option>'+parties.map(p=>'<option>'+p.name.replaceAll('"','&quot;')+'</option>').join('')+'</select></div><div class="field"><label>Item</label><select id="titem" onchange="setRate()"><option value="">Select item</option>'+items.map((p,i)=>'<option value="'+i+'">'+p.name.replaceAll('"','&quot;')+'</option>').join('')+'</select></div>'+field('Quantity','tqty','number','step="any" value="1" oninput="calcTotal()"')+field(sales?'Sale rate (₹)':'Purchase rate (₹)','trate','number','step="any" value="0" oninput="calcTotal()"')+field('Discount (₹)','tdiscount','number','step="any" value="0" oninput="calcTotal()"')+'<div class="field"><label>GST rate (%)</label><select id="tgst" onchange="calcTotal()"><option value="0">0%</option><option value="5">5%</option><option value="12">12%</option><option value="18">18%</option><option value="28">28%</option></select></div>'+field('Amount paid (₹)','tpaid','number','step="any" value="0"')+'<div class="field"><label>Taxable value</label><input id="ttaxable" value="0" readonly></div><div class="field"><label>GST amount</label><input id="ttax" value="0" readonly></div><div class="field"><label>Invoice total</label><input id="ttotal" value="0" readonly></div><div class="field"><label>Payment mode</label><select id="tmethod"><option>Cash</option><option>UPI</option><option>Bank</option><option>Credit</option></select></div></div><p><button class="btn primary">Save '+(sales?'sale':'purchase')+'</button></p></form>');window.currentTxn=k}
function setRate(){let i=get('items')[$('#titem').value];$('#trate').value=i?(window.currentTxn==='sales'?i.price:i.purchase):0;if($('#tgst'))$('#tgst').value=i?(i.gst||0):0;calcTotal()}
function calcTotal(){let taxable=Math.max(0,num($('#tqty').value)*num($('#trate').value)-num($('#tdiscount').value)),tax=taxable*num($('#tgst')?.value)/100;$('#ttaxable').value=taxable.toFixed(2);$('#ttax').value=tax.toFixed(2);$('#ttotal').value=(taxable+tax).toFixed(2)}
function saveTransaction(e,k){e.preventDefault();let sales=k==='sales',items=get('items'),idx=$('#titem').value,item=items[idx];if(!item)return alert('Select an item');let qty=num($('#tqty').value),total=num($('#ttotal').value),paid=num($('#tpaid').value);if(qty<=0||paid>total)return alert('Check quantity and paid amount');if(sales&&qty>item.qty)return alert('Insufficient stock. Available: '+item.qty);if(sales)item.qty-=qty;else item.qty+=qty;put('items',items);let a=get(k),taxable=num($('#ttaxable').value),tax=num($('#ttax').value);a.push({id:Date.now(),date:$('#tdate').value,invoice:$('#tinvoice').value,party:$('#tparty').value,item:item.name,qty,rate:num($('#trate').value),discount:num($('#tdiscount').value),gstRate:num($('#tgst').value),taxable,tax,total,paid,method:$('#tmethod').value,cost:qty*item.purchase});put(k,a);let cash=get('cash');if(paid>0)cash.push({date:$('#tdate').value,type:'Money '+(sales?'In':'Out'),method:$('#tmethod').value,note:(sales?'Sale ':'Purchase ')+$('#tinvoice').value,amount:paid});put('cash',cash);closeModal();render();if(sales)showInvoice(a[a.length-1])}

let scanStream=null,scanActive=false;
async function scanBarcode(){if(!('BarcodeDetector'in window))return alert('Barcode scanning is not supported by this browser. Use current Chrome or enter the barcode manually.');try{let detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});let video=document.createElement('video');video.setAttribute('playsinline','');video.style.cssText='width:100%;max-height:220px;background:#111;border-radius:10px';video.srcObject=scanStream;await video.play();modal('Scan product barcode','<div id="scanbox"></div><p class="muted">Point the rear camera at the barcode.</p><button type="button" class="btn" onclick="stopScanner()">Cancel</button>');$('#scanbox').appendChild(video);scanActive=true;let loop=async()=>{if(!scanActive)return;try{let codes=await detector.detect(video);if(codes.length){let code=codes[0].rawValue,idx=get('items').findIndex(x=>x.code===code);stopScanner();closeModal();if(idx<0)alert('No item found for barcode '+code);else{$('#titem').value=String(idx);setRate()}return}}catch(e){}requestAnimationFrame(loop)};requestAnimationFrame(loop)}catch(e){alert('Camera access failed. Allow camera permission and use HTTPS.')}}
function stopScanner(){scanActive=false;if(scanStream)scanStream.getTracks().forEach(t=>t.stop());scanStream=null}

function ledgerPage(){let customers=get('customers'),suppliers=get('suppliers'),sales=get('sales'),purchases=get('purchases'),payments=get('payments');let parties=[...customers.map(x=>({...x,type:'Customer'})),...suppliers.map(x=>({...x,type:'Supplier'}))];$('#view').innerHTML='<div class="sectionhead"><div><h2>Ledgers & payments</h2><div class="muted">Party-wise balances and payment entries</div></div><button class="btn primary" onclick="paymentForm()">＋ Record payment</button></div><div class="tabs"><button class="active" onclick="ledgerFilter(this,\'All\')">All parties</button><button onclick="ledgerFilter(this,\'Customer\')">Customers</button><button onclick="ledgerFilter(this,\'Supplier\')">Suppliers</button></div><div class="tablewrap"><table><thead><tr><th>Party</th><th>Type</th><th>Sales / Purchases</th><th>Payments</th><th>Balance</th><th>Gross profit</th></tr></thead><tbody id="ledgerrows">'+parties.map(p=>{let tx=p.type==='Customer'?sales.filter(x=>x.party===p.name):purchases.filter(x=>x.party===p.name),paid=payments.filter(x=>x.party===p.name&&x.type===p.type).reduce((s,x)=>s+x.amount,0),gross=tx.reduce((s,x)=>s+x.total,0),old=Number(p.opening)||0,balance=p.type==='Customer'?old+gross-tx.reduce((s,x)=>s+x.paid,0)-paid:old+gross-tx.reduce((s,x)=>s+x.paid,0)-paid;return '<tr data-type="'+p.type+'"><td>'+p.name+'</td><td>'+p.type+'</td><td>'+money(gross)+'</td><td>'+money(tx.reduce((s,x)=>s+x.paid,0)+paid)+'</td><td>'+money(balance)+'</td></tr>'}).join('')+'</tbody></table></div><div class="section"><h2>Recent payment entries</h2>'+table(payments.slice().reverse(),[['date','Date'],['type','Party type'],['party','Party'],['mode','Mode'],['amount','Amount'],['reference','Reference']])+'</div>'}

function paymentForm(){let all=[...get('customers').map(x=>({...x,type:'Customer'})),...get('suppliers').map(x=>({...x,type:'Supplier'}))];modal('Record receipt / payment','<form onsubmit="savePayment(event)"><div class="formgrid">'+field('Date','paydate','date','value="'+today+'"')+'<div class="field"><label>Entry type</label><select id="paytype" onchange="refreshPayParties()"><option>Customer</option><option>Supplier</option></select></div><div class="field full"><label>Party</label><select id="payparty">'+all.map(x=>'<option>'+x.name+'</option>').join('')+'</select></div>'+field('Amount (₹)','payamount','number','step="any" min="0.01"')+'<div class="field"><label>Payment mode</label><select id="paymode"><option>Cash</option><option>UPI</option><option>Bank</option><option>Cheque</option></select></div>'+field('Receipt / reference number','payref')+'</div><p><button class="btn primary">Save payment</button></p></form>')}

function stockSummary(){let a=get('items'),qty=sum(a,x=>x.qty),value=sum(a,x=>num(x.qty)*num(x.purchase)),retail=sum(a,x=>num(x.qty)*num(x.price)),low=a.filter(x=>num(x.qty)<=num(x.minStock??5));$('#view').innerHTML='<div class="sectionhead"><div><h2>Stock summary</h2><div class="muted">Current inventory and valuation</div></div><div class="actions"><button class="btn" onclick="printStockSummary()">Print / PDF</button><button class="btn primary" onclick="bulkItemsForm()">＋ Bulk items</button></div></div><div class="grid"><div class="card"><div class="statlabel">Item types</div><div class="stat">'+a.length+'</div></div><div class="card"><div class="statlabel">Total quantity</div><div class="stat">'+qty.toLocaleString('en-IN')+'</div></div><div class="card"><div class="statlabel">Purchase valuation</div><div class="stat">'+money(value)+'</div></div><div class="card"><div class="statlabel">Retail value</div><div class="stat">'+money(retail)+'</div></div><div class="card"><div class="statlabel">Low / out of stock</div><div class="stat">'+low.length+'</div></div></div><div class="section"><h2>Item-wise stock</h2><input class="search" placeholder="Search inventory" oninput="filterRows(this.value,\'stocksummaryrows\')"><div id="stocksummaryrows">'+table(a,[['name','Item'],['code','SKU'],['qty','Qty'],['unit','Unit'],['purchase','Cost / unit'],['price','Retail'],['wholesale','Wholesale'],['minStock','Reorder at']])+'</div></div>'}

function adjustForm(selected=0){let a=get('items');modal('Stock adjustment','<form onsubmit="saveAdjustment(event)"><div class="formgrid">'+field('Date','adjdate','date','value="'+today+'"')+'<div class="field"><label>Item</label><select id="adjitem">'+a.map((x,i)=>'<option value="'+i+'" '+(i===selected?'selected':'')+'>'+x.name+'</option>').join('')+'</select></div><div class="field"><label>Adjustment</label><select id="adjtype"><option value="add">Add stock</option><option value="remove">Remove stock</option><option value="set">Set exact stock</option></select></div>'+field('Quantity','adjqty','number','step="any" min="0.001"')+field('Reason','adjnote')+'</div><p><button class="btn primary">Save adjustment</button></p></form>')}

function restoreData(input){
 let f=input.files&&input.files[0];if(!f)return;
 const reset=()=>{input.value=""};
 if(f.size>10*1024*1024){alert("Backup file is larger than 10 MB.");reset();return}
 let reader=new FileReader();
 reader.onerror=()=>{alert("Could not read this backup file.");reset()};
 reader.onload=()=>{
  try{
   let data=JSON.parse(reader.result);
   if(!data||typeof data!=="object"||Array.isArray(data))throw new Error("Invalid backup structure");
   let keys=Object.keys(db);
   if(!keys.every(k=>Array.isArray(data[k])))throw new Error("This is not a complete SmartLedger backup");
   if(data.profile!==undefined&&(!data.profile||typeof data.profile!=="object"||Array.isArray(data.profile)))throw new Error("Invalid business profile");
   if(!confirm("Restore this backup? This will replace all SmartLedger records currently stored in this browser.")){reset();return}
   keys.forEach(k=>put(k,data[k]));
   if(data.profile){
    localStorage.bizname=String(data.profile.name||"");
    localStorage.bizphone=String(data.profile.phone||"");
    localStorage.gstin=String(data.profile.gstin||"");
   }
   alert("Backup restored successfully.");
   render();
  }catch(error){alert(error.message==="Invalid backup structure"||error.message==="This is not a complete SmartLedger backup"||error.message==="Invalid business profile"?error.message+". No data was changed.":"Invalid or unreadable backup. No data was changed.")}
  reset();
 };
 reader.readAsText(f);
}

function saveTransaction(e,k){

let txnScanStream=null,txnScanActive=false;
async function scanTxnLine(button){
 let row=button.closest(".txnline");if(!row)return;
 if(!("BarcodeDetector" in window))return alert("Barcode scan is not supported in this browser. Enter the barcode in the product list manually.");
 try{
  let detector=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39","qr_code"]});
  txnScanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
  let video=document.createElement("video");video.setAttribute("playsinline","");video.style.cssText="width:100%;max-height:180px;background:#111;border-radius:8px;margin-top:8px";
  video.srcObject=txnScanStream;await video.play();button.insertAdjacentElement("afterend",video);txnScanActive=true;button.textContent="Scanning…";
  let scan=async()=>{if(!txnScanActive)return;try{let found=await detector.detect(video);if(found.length){let code=found[0].rawValue,index=get("items").findIndex(x=>String(x.code)===String(code));stopTxnScan();if(index<0)alert("No product matches barcode "+code);else{let select=row.querySelector(".txitem");select.value=String(index);txnRate(select)}return}}catch(e){}requestAnimationFrame(scan)};requestAnimationFrame(scan);
 }catch(e){stopTxnScan();alert("Camera access failed. Allow camera permission and use the app over HTTPS.")}
}
function stopTxnScan(){txnScanActive=false;if(txnScanStream)txnScanStream.getTracks().forEach(t=>t.stop());txnScanStream=null;document.querySelectorAll(".txnline video").forEach(v=>v.remove());document.querySelectorAll(".txnline button").forEach(b=>{if(b.textContent==="Scanning…")b.textContent="▣ Scan barcode"})}
