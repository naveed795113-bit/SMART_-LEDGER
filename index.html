<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1457d9"><title>SmartLedger — Business Manager</title><style>
:root{--blue:#1759d1;--navy:#102c59;--bg:#f3f6fb;--card:#fff;--text:#17243a;--muted:#718096;--line:#e7edf5;--green:#159765;--red:#d64b52}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:245px;background:#102b55;color:#fff;padding:22px 14px;position:fixed;inset:0 auto 0 0;overflow:auto}.brand{font-size:21px;font-weight:800;padding:4px 12px 24px;letter-spacing:.2px}.brand small{display:block;font-size:10px;color:#a9c4ef;font-weight:500;letter-spacing:2px;margin-top:4px}.navlabel{font-size:10px;color:#91add5;padding:14px 12px 7px;text-transform:uppercase;letter-spacing:1.4px}.nav button{width:100%;border:0;background:transparent;color:#d8e4f7;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0}.nav button.active,.nav button:hover{background:#234879;color:white}.main{margin-left:245px;width:calc(100% - 245px)}.top{height:68px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.top strong{font-size:17px}.topright{display:flex;gap:12px;align-items:center}.pill{background:#edf3ff;color:var(--blue);padding:7px 11px;border-radius:20px;font-size:12px;font-weight:700}.content{padding:25px;max-width:1400px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.welcome h1{font-size:23px;margin:0 0 5px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:0 2px 8px #18345c08}.statlabel{color:var(--muted);font-size:12px}.stat{font-size:24px;font-weight:750;margin:10px 0 5px}.positive{color:var(--green)}.negative{color:var(--red)}.section{margin-top:20px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sectionhead h2{font-size:16px;margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 13px;color:var(--text);font-weight:600}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.soft{background:#edf3ff;color:var(--blue);border-color:#dce8ff}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.quick button{background:#fff;border:1px solid var(--line);padding:16px;border-radius:12px;text-align:left;font-weight:700;color:var(--text)}.quick span{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:6px}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px}th{background:#f8faff;color:#65748b;font-weight:650}tr:last-child td{border-bottom:0}.empty{text-align:center;color:var(--muted);padding:30px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field label{display:block;font-size:12px;color:#62718a;margin-bottom:6px}.field input,.field select,.field textarea,.search{width:100%;border:1px solid #dce4ef;border-radius:8px;padding:10px 11px;background:white;outline:none}.field input:focus,.field select:focus{border-color:var(--blue)}.field.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#10213c88;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.show{display:flex}.dialog{background:white;border-radius:15px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:22px}.dialoghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.dialoghead h2{margin:0;font-size:18px}.close{border:0;background:#eef2f8;border-radius:50%;width:30px;height:30px}.tabs{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:white;padding:8px 12px;border-radius:8px}.tabs button.active{background:#eaf1ff;color:var(--blue);border-color:#cddcff}.notice{background:#fff8e8;border:1px solid #f4e2b4;padding:12px;border-radius:10px;color:#76581a;font-size:12px}.mobilehead{display:none}.chartbar{height:9px;background:#edf1f7;border-radius:10px;overflow:hidden;margin-top:9px}.chartbar i{display:block;height:100%;background:var(--blue);border-radius:10px}.badge{font-size:11px;padding:4px 8px;border-radius:20px;background:#e9f7f1;color:#14835b}.hidden{display:none!important}
@media(max-width:850px){.side{width:70px;padding:15px 8px}.brand{font-size:0;padding:10px 8px}.brand:first-letter{font-size:22px}.brand small,.navlabel,.nav button .txt{display:none}.nav button{text-align:center;font-size:18px;padding:13px 4px}.main{margin-left:70px;width:calc(100% - 70px)}.content{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.quick{grid-template-columns:repeat(2,1fr)}.top{padding:0 16px}}@media(max-width:520px){.top{height:58px}.topright .pill{display:none}.welcome{align-items:flex-start;gap:12px;flex-direction:column}.grid{gap:9px}.card{padding:13px}.stat{font-size:20px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.quick button{padding:13px}.content{padding:13px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">◈ SmartLedger<small>BUSINESS MANAGER</small></div><nav class="nav" id="nav"><div class="navlabel">Workspace</div><button class="active" data-page="Dashboard">▦ <span class="txt">Dashboard</span></button><button data-page="Sales">▤ <span class="txt">Sales</span></button><button data-page="Purchases">▣ <span class="txt">Purchases</span></button><button data-page="Items">▧ <span class="txt">Items & Stock</span></button><div class="navlabel">People</div><button data-page="Customers">♙ <span class="txt">Customers</span></button><button data-page="Suppliers">♧ <span class="txt">Suppliers</span></button><button data-page="Expenses">₹ <span class="txt">Expenses</span></button><div class="navlabel">Accounts</div><button data-page="Cash & Bank">▤ <span class="txt">Cash & Bank</span></button><button data-page="Reports">▥ <span class="txt">Reports</span></button><button data-page="Settings">⚙ <span class="txt">Settings</span></button></nav></aside><main class="main"><header class="top"><strong id="pagetitle">Dashboard</strong><div class="topright"><span class="pill">✦ SMARTLEDGER PRO</span><span id="today" class="muted"></span></div></header><div class="content" id="view"></div></main></div><div class="modal" id="modal"><div class="dialog"><div class="dialoghead"><h2 id="modaltitle">Add</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalbody"></div></div></div><script>
const $=s=>document.querySelector(s), money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2}), db={items:'sl_items',customers:'sl_customers',suppliers:'sl_suppliers',sales:'sl_sales',purchases:'sl_purchases',expenses:'sl_expenses',cash:'sl_cash'};
const get=k=>JSON.parse(localStorage.getItem(db[k])||'[]'), put=(k,v)=>localStorage.setItem(db[k],JSON.stringify(v)), num=v=>Number(v)||0, sum=(a,f)=>a.reduce((s,x)=>s+num(f(x)),0), today=new Date().toISOString().slice(0,10);
$('#today').textContent=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
let page='Dashboard';
function totals(){let s=get('sales'),p=get('purchases'),e=get('expenses');return {sales:sum(s,x=>x.total),purchases:sum(p,x=>x.total),expenses:sum(e,x=>x.amount),received:sum(s,x=>x.paid),paid:sum(p,x=>x.paid),stock:sum(get('items'),x=>x.qty*x.purchase),profit:sum(s,x=>x.total-x.cost)-sum(e,x=>x.amount)}}
function go(p){page=p;$('#pagetitle').textContent=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
function render(){let t=totals(),v=$('#view');if(page==='Dashboard'){v.innerHTML=`<div class="welcome"><div><h1>Business overview</h1><div class="muted">Your business at a glance</div></div><div class="actions"><button class="btn" onclick="exportData()">↓ Backup</button><button class="btn primary" onclick="saleForm()">＋ New Sale</button></div></div><div class="grid"><div class="card"><div class="statlabel">Total Sales</div><div class="stat">${money(t.sales)}</div><div class="muted">All recorded invoices</div></div><div class="card"><div class="statlabel">Total Purchases</div><div class="stat">${money(t.purchases)}</div><div class="muted">All recorded purchases</div></div><div class="card"><div class="statlabel">Expenses</div><div class="stat">${money(t.expenses)}</div><div class="muted">Business expenses</div></div><div class="card"><div class="statlabel">Estimated Net Profit</div><div class="stat ${t.profit>=0?'positive':'negative'}">${money(t.profit)}</div><div class="muted">Sales gross margin less expenses</div></div><div class="card"><div class="statlabel">Customer Receivables</div><div class="stat">${money(sum(get('sales'),x=>x.total-x.paid))}</div></div><div class="card"><div class="statlabel">Supplier Payables</div><div class="stat">${money(sum(get('purchases'),x=>x.total-x.paid))}</div></div><div class="card"><div class="statlabel">Stock Valuation</div><div class="stat">${money(t.stock)}</div></div><div class="card"><div class="statlabel">Cash Received</div><div class="stat">${money(t.received)}</div></div></div><div class="section"><div class="sectionhead"><h2>Quick actions</h2></div><div class="quick"><button onclick="saleForm()">＋ Create Sale<span>Tax / retail invoice</span></button><button onclick="purchaseForm()">＋ Add Purchase<span>Record supplier stock</span></button><button onclick="itemForm()">▧ Add Item<span>Manage inventory</span></button><button onclick="partyForm('customers')">♙ Add Customer<span>Manage parties</span></button></div></div><div class="section"><div class="sectionhead"><h2>Recent sales</h2><button class="btn soft" onclick="go('Sales')">View all</button></div>${table(get('sales').slice(-5).reverse(),[['date','Date'],['invoice','Invoice'],['party','Customer'],['total','Amount']],true)}</div>`;}else if(page==='Items')listItems();else if(page==='Customers'||page==='Suppliers')listParties(page.toLowerCase());else if(page==='Sales')listTransactions('sales');else if(page==='Purchases')listTransactions('purchases');else if(page==='Expenses')listExpenses();else if(page==='Reports')reports();else if(page==='Cash & Bank')cashPage();else if(page==='Settings')settings(); }
function table(rows,cols,amt=false){if(!rows.length)return '<div class="empty">No records yet</div>';return '<div class="tablewrap"><table><thead><tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+(c[0]==='total'||c[0]==='amount'?money(r[c[0]]):String(r[c[0]]??'—').replaceAll('<','&lt;'))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function listItems(){let a=get('items');$('#view').innerHTML='<div class="sectionhead"><div><h2>Items & inventory</h2><div class="muted">Manage products, prices and stock</div></div><button class="btn primary" onclick="itemForm()">＋ Add item</button></div><input class="search" placeholder="Search item or barcode..." oninput="filterRows(this.value,'itemrows')"><div class="section" id="itemrows">'+table(a,[['name','Item'],['code','SKU / Barcode'],['qty','Stock'],['unit','Unit'],['purchase','Purchase price'],['price','Sale price']])+'</div>'}
function listParties(k){let a=get(k);$('#view').innerHTML='<div class="sectionhead"><div><h2>'+ (k==='customers'?'Customers':'Suppliers')+'</h2><div class="muted">Party directory and balances</div></div><button class="btn primary" onclick="partyForm(\''+k+'\')">＋ Add '+(k==='customers'?'customer':'supplier')+'</button></div><input class="search" placeholder="Search name or phone..." oninput="filterRows(this.value,'partyrows')"><div class="section" id="partyrows">'+table(a,[['name','Name'],['phone','Phone'],['address','Address'],['opening','Opening balance']])+'</div>'}
function listTransactions(k){let a=get(k);$('#view').innerHTML='<div class="sectionhead"><div><h2>'+(k==='sales'?'Sales invoices':'Purchase bills')+'</h2><div class="muted">Create and track transactions</div></div><button class="btn primary" onclick="'+(k==='sales'?'saleForm()':'purchaseForm()')+'">＋ New '+(k==='sales'?'sale':'purchase')+'</button></div><div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:15px"><div class="card"><div class="statlabel">Total</div><div class="stat">'+money(sum(a,x=>x.total))+'</div></div><div class="card"><div class="statlabel">Paid</div><div class="stat">'+money(sum(a,x=>x.paid))+'</div></div><div class="card"><div class="statlabel">Balance</div><div class="stat">'+money(sum(a,x=>x.total-x.paid))+'</div></div></div>'+table(a.slice().reverse(),[['date','Date'],['invoice','Invoice'],['party','Party'],['total','Total'],['paid','Paid']])}
function listExpenses(){let a=get('expenses');$('#view').innerHTML='<div class="sectionhead"><div><h2>Expenses</h2><div class="muted">Track operating costs</div></div><button class="btn primary" onclick="expenseForm()">＋ Add expense</button></div>'+table(a.slice().reverse(),[['date','Date'],['category','Category'],['note','Description'],['amount','Amount']])}
function reports(){let t=totals();$('#view').innerHTML='<div class="welcome"><div><h1>Reports & analytics</h1><div class="muted">Summary based on transactions entered in this device</div></div><button class="btn" onclick="exportData()">↓ Export backup</button></div><div class="grid"><div class="card"><div class="statlabel">Sales</div><div class="stat">'+money(t.sales)+'</div></div><div class="card"><div class="statlabel">Purchases</div><div class="stat">'+money(t.purchases)+'</div></div><div class="card"><div class="statlabel">Expenses</div><div class="stat">'+money(t.expenses)+'</div></div><div class="card"><div class="statlabel">Estimated net profit</div><div class="stat">'+money(t.profit)+'</div></div></div><div class="section card"><h2>Financial summary</h2><p>Cash received from sales: <b>'+money(t.received)+'</b></p><p>Payments recorded against purchases: <b>'+money(t.paid)+'</b></p><p>Customer outstanding: <b>'+money(sum(get('sales'),x=>x.total-x.paid))+'</b></p><p>Supplier outstanding: <b>'+money(sum(get('purchases'),x=>x.total-x.paid))+'</b></p><div class="notice">Profit is an estimate using item purchase costs captured on each sale. Uncosted sales, tax adjustments, opening balances and allocated overheads may make actual profit different.</div></div>'}
function cashPage(){let a=get('cash');$('#view').innerHTML='<div class="sectionhead"><div><h2>Cash & bank</h2><div class="muted">Record cash and bank movements</div></div><button class="btn primary" onclick="cashForm()">＋ Record entry</button></div>'+table(a.slice().reverse(),[['date','Date'],['type','Type'],['method','Account'],['note','Description'],['amount','Amount']])}
function settings(){$('#view').innerHTML='<div class="welcome"><div><h1>Settings</h1><div class="muted">Business profile and data controls</div></div></div><div class="card"><h2>Business profile</h2><div class="formgrid"><div class="field"><label>Business name</label><input id="bizname" value="'+(localStorage.bizname||'SmartLedger Business')+'"></div><div class="field"><label>Phone</label><input id="bizphone" value="'+(localStorage.bizphone||'')+'"></div><div class="field"><label>GSTIN</label><input id="gstin" value="'+(localStorage.gstin||'')+'"></div><div class="field"><label>Currency</label><input value="INR — Indian Rupee" disabled></div></div><p><button class="btn primary" onclick="localStorage.bizname=$(\'#bizname\').value;localStorage.bizphone=$(\'#bizphone\').value;localStorage.gstin=$(\'#gstin\').value;alert('Profile saved')">Save profile</button></p></div><div class="section card"><h2>Data management</h2><p class="muted">Your entries are stored in this browser on this device. Export backups regularly.</p><div class="actions"><button class="btn primary" onclick="exportData()">Download full backup</button><button class="btn" onclick="document.getElementById('restore').click()">Restore backup</button><input id="restore" type="file" accept="application/json" class="hidden" onchange="restoreData(this)"></div></div><div class="section notice">Premium-style tools included in this starter: inventory, sales and purchase records, party directory, expenses, reports, cash book and data backup. Online sync, GST e-invoicing, payment gateway, multi-device login and printer integrations require backend services and credentials.</div>'}
function modal(title,body){$('#modaltitle').textContent=title;$('#modalbody').innerHTML=body;$('#modal').classList.add('show')}function closeModal(){$('#modal').classList.remove('show')}
function field(label,id,type='text',extra=''){return '<div class="field"><label>'+label+'</label><input id="'+id+'" type="'+type+'" '+extra+'></div>'}
function itemForm(){modal('Add inventory item','<form onsubmit="saveItem(event)"><div class="formgrid">'+field('Item name','iname')+field('SKU / Barcode','icode')+field('Opening stock','iqty','number','step="any" value="0"')+field('Unit','iunit')+field('Purchase price (₹)','ipurchase','number','step="any" value="0"')+field('Sale price (₹)','iprice','number','step="any" value="0"')+'</div><p><button class="btn primary">Save item</button></p></form>')}
function saveItem(e){e.preventDefault();let a=get('items');a.push({name:$('#iname').value,code:$('#icode').value,qty:num($('#iqty').value),unit:$('#iunit').value||'pcs',purchase:num($('#ipurchase').value),price:num($('#iprice').value)});put('items',a);closeModal();render()}
function partyForm(k){modal(k==='customers'?'Add customer':'Add supplier','<form onsubmit="saveParty(event,\''+k+'\')"><div class="formgrid">'+field('Name','pname')+field('Phone','pphone')+field('Address','paddress')+field('Opening balance (₹)','popening','number','step="any" value="0"')+'</div><p><button class="btn primary">Save</button></p></form>')}
function saveParty(e,k){e.preventDefault();let a=get(k);a.push({name:$('#pname').value,phone:$('#pphone').value,address:$('#paddress').value,opening:num($('#popening').value)});put(k,a);closeModal();render()}
function transactionForm(k){let sales=k==='sales',items=get('items'),parties=get(sales?'customers':'suppliers');modal(sales?'New sale invoice':'New purchase bill','<form onsubmit="saveTransaction(event,\''+k+'\')"><div class="formgrid">'+field('Date','tdate','date','value="'+today+'"')+field('Invoice / bill number','tinvoice','text','value="'+(sales?'SL-':'PB-')+Date.now().toString().slice(-6)+'"')+'<div class="field"><label>'+(sales?'Customer':'Supplier')+'</label><select id="tparty"><option>Walk-in</option>'+parties.map(p=>'<option>'+p.name.replaceAll('"','&quot;')+'</option>').join('')+'</select></div><div class="field"><label>Item</label><select id="titem" onchange="setRate()"><option value="">Select item</option>'+items.map((p,i)=>'<option value="'+i+'">'+p.name.replaceAll('"','&quot;')+'</option>').join('')+'</select></div>'+field('Quantity','tqty','number','step="any" value="1" oninput="calcTotal()"')+field(sales?'Sale rate (₹)':'Purchase rate (₹)','trate','number','step="any" value="0" oninput="calcTotal()"')+field('Discount (₹)','tdiscount','number','step="any" value="0" oninput="calcTotal()"')+field('Amount paid (₹)','tpaid','number','step="any" value="0"')+'<div class="field"><label>Total</label><input id="ttotal" value="0" readonly></div><div class="field"><label>Payment mode</label><select id="tmethod"><option>Cash</option><option>UPI</option><option>Bank</option><option>Credit</option></select></div></div><p><button class="btn primary">Save '+(sales?'sale':'purchase')+'</button></p></form>');window.currentTxn=k}
function setRate(){let i=get('items')[$('#titem').value];$('#trate').value=i?(window.currentTxn==='sales'?i.price:i.purchase):0;calcTotal()}
function calcTotal(){$('#ttotal').value=Math.max(0,num($('#tqty').value)*num($('#trate').value)-num($('#tdiscount').value)).toFixed(2)}
function saveTransaction(e,k){e.preventDefault();let sales=k==='sales',items=get('items'),idx=$('#titem').value,item=items[idx];if(!item)return alert('Select an item');let qty=num($('#tqty').value),total=num($('#ttotal').value),paid=num($('#tpaid').value);if(qty<=0||paid>total)return alert('Check quantity and paid amount');if(sales&&qty>item.qty)return alert('Insufficient stock. Available: '+item.qty);if(sales)item.qty-=qty;else item.qty+=qty;put('items',items);let a=get(k);a.push({date:$('#tdate').value,invoice:$('#tinvoice').value,party:$('#tparty').value,item:item.name,qty,rate:num($('#trate').value),total,paid,method:$('#tmethod').value,cost:qty*item.purchase});put(k,a);closeModal();render()}
function saleForm(){transactionForm('sales')}function purchaseForm(){transactionForm('purchases')}
function expenseForm(){modal('Add expense','<form onsubmit="saveExpense(event)"><div class="formgrid">'+field('Date','edate','date','value="'+today+'"')+'<div class="field"><label>Category</label><select id="ecat"><option>Rent</option><option>Salary</option><option>Transport / Fuel</option><option>Electricity</option><option>Telephone / Internet</option><option>Other</option></select></div>'+field('Description','enote')+field('Amount (₹)','eamount','number','step="any"')+'</div><p><button class="btn primary">Save expense</button></p></form>')}
function saveExpense(e){e.preventDefault();let a=get('expenses');a.push({date:$('#edate').value,category:$('#ecat').value,note:$('#enote').value,amount:num($('#eamount').value)});put('expenses',a);closeModal();render()}
function cashForm(){modal('Cash / bank entry','<form onsubmit="saveCash(event)"><div class="formgrid">'+field('Date','cdate','date','value="'+today+'"')+'<div class="field"><label>Type</label><select id="ctype"><option>Money In</option><option>Money Out</option></select></div><div class="field"><label>Account</label><select id="cmethod"><option>Cash</option><option>Bank</option><option>UPI</option></select></div>'+field('Description','cnote')+field('Amount (₹)','camount','number','step="any"')+'</div><p><button class="btn primary">Save entry</button></p></form>')}
function saveCash(e){e.preventDefault();let a=get('cash');a.push({date:$('#cdate').value,type:$('#ctype').value,method:$('#cmethod').value,note:$('#cnote').value,amount:num($('#camount').value)});put('cash',a);closeModal();render()}
function filterRows(q,id){let el=document.getElementById(id);if(!el)return;el.querySelectorAll('tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q.toLowerCase())?'':'none')}
function exportData(){let data={profile:{name:localStorage.bizname||'',phone:localStorage.bizphone||'',gstin:localStorage.gstin||''},};Object.keys(db).forEach(k=>data[k]=get(k));let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='smartledger-backup-'+today+'.json';a.click();URL.revokeObjectURL(a.href)}
function restoreData(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);Object.keys(db).forEach(k=>{if(Array.isArray(d[k]))put(k,d[k])});alert('Backup restored');render()}catch(e){alert('Invalid backup file')}};r.readAsText(f)}
render();
</script></body></html>
