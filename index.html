/* v12.0: fixed app shell; each workspace owns its scroll position */
html,body{height:100%;min-height:100%;overflow:hidden}
.app{height:100dvh;min-height:0;overflow:hidden}
.side{height:100dvh;overscroll-behavior:contain}
.main{height:100dvh;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.top{flex:0 0 auto}
.content{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;scrollbar-gutter:stable}
.modal{overscroll-behavior:contain}
.dialog{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
@media(max-width:850px){.main{height:100dvh;padding-top:62px}.content{min-height:0;padding-bottom:calc(82px + env(safe-area-inset-bottom))}.side{height:62px}}
@media(max-width:520px){.main{padding-top:62px}.content{padding-bottom:calc(82px + env(safe-area-inset-bottom))}}
/* v12 section shortcuts: compact grid, no horizontal tab strip */
.section-quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;overflow:visible;padding:3px 0 12px;margin:0 0 12px}
.section-quick button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:42px;white-space:normal;text-align:center;padding:9px 10px;border-radius:12px}
.section-quick button.section-more{background:linear-gradient(145deg,#f2e5e1,#e7d4d0);border-color:#d7bdb8;font-weight:800}
.section-quick button.section-more .more-mark{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:#702b3a;color:white;font-size:14px}
.section-action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.section-action-grid .more-link{min-height:68px}
@media(min-width:700px){.section-quick{grid-template-columns:repeat(4,minmax(0,1fr))}.section-action-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

<script>
const APP_VERSION='47.0.0', BACKUP_SCHEMA_VERSION=5;
const $=s=>document.querySelector(s), money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2}), db={items:'sl_items',customers:'sl_customers',suppliers:'sl_suppliers',sales:'sl_sales',purchases:'sl_purchases',expenses:'sl_expenses',cash:'sl_cash',payments:'sl_payments',adjustments:'sl_adjustments',batches:'sl_batches',salesReturns:'sl_sales_returns',purchaseReturns:'sl_purchase_returns'};
const get=k=>JSON.parse(localStorage.getItem(db[k])||'[]'), put=(k,v)=>localStorage.setItem(db[k],JSON.stringify(v)), num=v=>Number(v)||0, sum=(a,f)=>a.reduce((s,x)=>s+num(f(x)),0), today=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);

const iconSvg=(name)=>{const paths={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',sales:'<path d="M7 3h10l4 4v14H7z"/><path d="M17 3v5h4M10 13h8M10 17h8"/>',purchase:'<path d="M3 4h2l2.2 11.5a2 2 0 0 0 2 1.5h8.6a2 2 0 0 0 1.9-1.4L22 9H6"/><circle cx="10" cy="21" r="1"/><circle cx="18" cy="21" r="1"/>',items:'<path d="m12 3 9 5-9 5-9-5z"/><path d="M3 8v9l9 5 9-5V8M12 13v9"/>',people:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5v1"/>',expense:'<path d="M12 2v20M17 6H9a3 3 0 0 0 0 6h6a3 3 0 0 1 0 6H6"/>',cash:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M12 12v1"/>',ledger:'<path d="M4 7h15M15 3l4 4-4 4M20 17H5m4-4-4 4 4 4"/>',alert:'<path d="M12 3 22 20H2z"/><path d="M12 9v4m0 3h.01"/>',report:'<path d="M4 20V4m0 16h17M8 16v-5m5 5V7m5 9v-8"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 2z"/>',more:'<path d="M4 6h16M4 12h16M4 18h16"/>'};return '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(paths[name]||paths.items)+'</svg>'};
function applyNavIcons(){let map={'Dashboard':'home','Sales':'sales','Purchases':'purchase','Items':'items','Customers':'people','Suppliers':'people','Expenses':'expense','Cash & Bank':'cash','Ledgers':'ledger','Stock Alerts':'alert','Tax Reports':'report','Reports':'report','Settings':'settings'};document.querySelectorAll('#nav button[data-page]').forEach(b=>{let key=b.dataset.page,txt=b.querySelector('.txt');if(txt){b.firstChild.textContent='';let holder=document.createElement('span');holder.className='nav-icon';holder.innerHTML=iconSvg(map[key]);b.insertBefore(holder,txt)}});document.querySelectorAll('#mobileNav button[data-page]').forEach(b=>{let key=b.dataset.page==='Dashboard'?'home':b.dataset.page==='Sales'?'sales':b.dataset.page==='Purchases'?'purchase':b.dataset.page==='Items'?'items':'more',mi=b.querySelector('.mi');if(mi)mi.innerHTML=iconSvg(key)})}
let page='Dashboard';
function returnMetric(r,tx,field){if(r&&r[field]!==undefined&&r[field]!==null)return num(r[field]);if(!tx)return 0;let lines=Array.isArray(tx.lines)?tx.lines:[],index=Number.isInteger(Number(r.lineIndex))?Number(r.lineIndex):lines.findIndex(x=>x.item===r.item),line=index>=0?lines[index]:null;if(line&&line[field]!==undefined&&num(line.qty)>0)return num(line[field])*num(r.qty)/num(line.qty);return num(tx.qty)>0?num(tx[field])*num(r.qty)/num(tx.qty):0}
function returnSummary(){let sales=get("sales"),returns=get("salesReturns");return {amount:sum(returns,x=>x.amount),cost:sum(returns,r=>returnMetric(r,sales.find(x=>String(x.id)===String(r.originalId)),"cost")),tax:sum(returns,r=>returnMetric(r,sales.find(x=>String(x.id)===String(r.originalId)),"tax"))}}
function purchaseReturnSummary(){let purchases=get("purchases"),returns=get("purchaseReturns");return {amount:sum(returns,x=>x.amount),tax:sum(returns,r=>returnMetric(r,purchases.find(x=>String(x.id)===String(r.originalId)),"tax"))}}
function totals(){let s=get('sales'),p=get('purchases'),e=get('expenses'),r=returnSummary(),pr=purchaseReturnSummary();return {sales:sum(s,x=>x.total)-r.amount-r.tax,purchases:sum(p,x=>x.total)-pr.amount-pr.tax,expenses:sum(e,x=>x.amount),received:sum(s,x=>x.paid),paid:sum(p,x=>x.paid),stock:sum(get('items'),x=>x.qty*x.purchase),profit:sum(s,x=>(x.taxable??x.total)-x.cost)-r.amount+r.cost-sum(e,x=>x.amount)}}
function go(p){page=p;$('#pagetitle').textContent=p==='More'?'More':p;document.querySelectorAll('.nav button,.mobile-nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p||(b.dataset.page==='More'&&['Customers','Suppliers','Expenses','Cash & Bank','Ledgers','Stock Alerts','Tax Reports','Reports','Accounts','Accounts','Settings'].includes(p))));render()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});$('#mobileNav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
function dashboardDetail(kind){let title='',html='';if(kind==='pay'||kind==='collect'){let type=kind==='pay'?'Supplier':'Customer',customer=type==='Customer',parties=get(customer?'customers':'suppliers'),tx=get(customer?'sales':'purchases'),names=parties.map(p=>p.name);tx.forEach(x=>{if(x.party&&!names.includes(x.party))names.push(x.party)});let rows=names.map(name=>({name,balance:partyOutstanding(type,name)})).filter(x=>Math.abs(x.balance)>.004).sort((a,b)=>b.balance-a.balance);title=customer?'Customer collections due':'Supplier payments due';html='<div class="grid"><div class="card"><div class="statlabel">Total '+(customer?'to collect':'to pay')+'</div><div class="stat">'+money(outstandingTotal(type))+'</div></div><div class="card"><div class="statlabel">Parties with balance</div><div class="stat">'+rows.length+'</div></div></div><div class="section"><h3>Party-wise outstanding</h3>'+(rows.length?'<div class="tablewrap"><table><thead><tr><th>'+(customer?'Customer':'Supplier')+'</th><th>Outstanding</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+String(x.name).replaceAll('<','&lt;')+'</td><td>'+money(x.balance)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No outstanding balances.</div>')+'</div><div class="actions"><button class="btn primary" onclick="closeModal();go(\'Ledgers\')">Open ledgers</button><button class="btn" onclick="closeModal();paymentForm()">Record payment / receipt</button></div>';}else if(kind==='profit'){let sales=get('sales'),expenses=get('expenses'),gross=sum(sales,x=>num(x.taxable??x.total)-num(x.cost)),exp=sum(expenses,x=>x.amount),missing=sales.filter(x=>!num(x.cost)).length;title='Profit & Loss details';html='<div class="grid"><div class="card"><div class="statlabel">Sales</div><div class="stat">'+money(sum(sales,x=>x.total))+'</div></div><div class="card"><div class="statlabel">Cost of goods sold</div><div class="stat">'+money(sum(sales,x=>x.cost))+'</div></div><div class="card"><div class="statlabel">Gross profit estimate</div><div class="stat">'+money(gross)+'</div></div><div class="card"><div class="statlabel">Expenses</div><div class="stat">'+money(exp)+'</div></div><div class="card"><div class="statlabel">Net profit estimate</div><div class="stat">'+money(gross-exp)+'</div></div></div><div class="notice">Based on recorded sales item costs and expenses. '+missing+' sales record(s) have no recorded cost and may understate accuracy.</div><div class="actions"><button class="btn primary" onclick="closeModal();go(\'Reports\')">Open full reports</button></div>';}else{title='Daily sale details';let rows=get('sales').filter(x=>x.date===today).slice().reverse(),total=sum(rows,x=>x.total),paid=sum(rows,x=>x.paid);html='<div class="grid"><div class="card"><div class="statlabel">Total sales today</div><div class="stat">'+money(total)+'</div></div><div class="card"><div class="statlabel">Invoices</div><div class="stat">'+rows.length+'</div></div><div class="card"><div class="statlabel">Received</div><div class="stat">'+money(paid)+'</div></div><div class="card"><div class="statlabel">Balance due</div><div class="stat">'+money(total-paid)+'</div></div></div><div class="section"><h3>Today invoices</h3>'+(rows.length?'<div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Total</th><th>Paid</th><th>Due</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+String(x.invoice||'—')+'</td><td>'+String(x.party||'—').replaceAll('<','&lt;')+'</td><td>'+money(x.total)+'</td><td>'+money(x.paid)+'</td><td>'+money(num(x.total)-num(x.paid))+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No sales recorded today.</div>')+'</div><div class="actions"><button class="btn primary" onclick="closeModal();go(\'Sales\')">Open all sales</button><button class="btn" onclick="closeModal();saleForm()">Create sale</button></div>';}modal(title,html);}function salesOverviewGraph(){
 let points=Array.from({length:7},(_,i)=>{
  let d=new Date();d.setDate(d.getDate()-6+i);
  let key=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
  return {label:d.toLocaleDateString('en-IN',{weekday:'short'}),value:sum(get('sales').filter(x=>x.date===key),x=>x.total)};
 });
 let max=Math.max(1,...points.map(p=>p.value));
 let bars=points.map((p,i)=>{
  let x=15+i*50, h=Math.max(4,p.value/max*82), y=105-h, side=9;
  let label=p.value?'<text x="'+(x+15)+'" y="'+Math.max(12,y-7)+'" text-anchor="middle" class="chart-value">'+(p.value>=100000?'₹'+(p.value/100000).toFixed(1)+'L':p.value>=1000?'₹'+(p.value/1000).toFixed(1)+'k':'₹'+Math.round(p.value))+'</text>':'';
  return label+'<polygon points="'+x+','+y+' '+(x+side)+','+(y-6)+' '+(x+side+22)+','+(y-6)+' '+(x+22)+','+y+'" class="bar-top"/><polygon points="'+(x+22)+','+y+' '+(x+side+22)+','+(y-6)+' '+(x+side+22)+',105 '+(x+22)+',111" class="bar-side"/><rect x="'+x+'" y="'+y+'" width="22" height="'+(105-y)+'" rx="3" class="bar-front"/><text x="'+(x+16)+'" y="132" text-anchor="middle" class="chart-day">'+p.label+'</text>';
 }).join('');
 return '<svg class="sales-chart" viewBox="0 0 360 150" role="img" aria-label="Three-dimensional daily sales bar chart for the last seven days"><path d="M8 111H352" class="chart-base"/>'+bars+'</svg>';
}
function applyModuleTheme(){const b=document.body;b.classList.remove('module-inventory','module-sales','module-purchases','module-ledger','module-other','module-more');if(page==='Dashboard')return;if(page==='More'){b.classList.add('module-more');return}const inventory=['Items','Item Insights','Batch & Expiry','Stock Summary','Stock Alerts'];const other=['Customers','Suppliers','Expenses','Cash & Bank','Tax Reports','Reports','Settings','Accounts'];const cls=inventory.includes(page)?'module-inventory':page==='Sales'?'module-sales':page==='Purchases'?'module-purchases':page==='Ledgers'?'module-ledger':other.includes(page)?'module-other':'module-other';b.classList.add(cls)}
function render(){applyModuleTheme();let t=totals(),v=$('#view');if(page==='Item Insights')itemInsights();else if(page==='Batch & Expiry')batchExpiryPage();else if(page==='Dashboard'){v.innerHTML=`<div class="welcome"><div><h1>Business overview</h1><div class="muted">Your business at a glance</div></div></div><div class="dashboard-quick"><button onclick="saleForm()">${iconSvg("sales")}<b>New Sale</b></button><button onclick="purchaseForm()">${iconSvg("purchase")}<b>Purchase</b></button><button onclick="itemForm()">${iconSvg("items")}<b>Add Item</b></button><button onclick="openAIAssistant()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/><path d="m19 14 1 2.8 3 1.2-3 1.1-1 2.9-1.1-2.9-2.9-1.1 2.9-1.2z"/></svg><b>AI Assistant</b></button></div><div class="dashboard-overview"><button class="overview-card" onclick="dashboardDetail('pay')"><span class="statlabel">To Pay</span><strong class="stat">${money(outstandingTotal('Supplier'))}</strong><small>Supplier outstanding · Tap for details</small></button><button class="overview-card" onclick="dashboardDetail('collect')"><span class="statlabel">To Collect</span><strong class="stat">${money(outstandingTotal('Customer'))}</strong><small>Customer outstanding · Tap for details</small></button><button class="overview-card" onclick="dashboardDetail('profit')"><span class="statlabel">Profit &amp; Loss</span><strong class="stat">${money(t.profit)}</strong><small>Estimated net profit · Tap for details</small></button><button class="overview-card" onclick="dashboardDetail('daily')"><span class="statlabel">Daily Sale Details</span><strong class="stat">${money(sum(get('sales').filter(x=>x.date===today),x=>x.total))}</strong><small>${get('sales').filter(x=>x.date===today).length} invoices today · Tap for details</small></button></div><div class="sales-overview-card"><div class="sales-overview-head"><div><h2>Sales overview</h2><p>Last 7 days · Daily sales trend</p></div><strong class="sales-overview-total">${money(sum(get('sales').filter(x=>x.date>=new Date(Date.now()-6*86400000).toISOString().slice(0,10)),x=>x.total))}</strong></div>${salesOverviewGraph()}</div>` ;}else if(page==='Items')listItems();else if(page==='Customers'||page==='Suppliers')listParties(page.toLowerCase());else if(page==='Sales')listTransactions('sales');else if(page==='Purchases')listTransactions('purchases');else if(page==='Expenses')listExpenses();else if(page==='Reports')reports();else if(page==='Cash & Bank')cashPage();else if(page==='Ledgers')ledgerPage();else if(page==='Stock Alerts')stockAlerts();else if(page==='Stock Summary')stockSummary();else if(page==='Tax Reports')taxReports();else if(page==='Settings')settings();else if(page==='More')morePage(); addSectionQuickLinks(); }
function table(rows,cols,amt=false){if(!rows.length)return '<div class="empty">No records yet</div>';return '<div class="tablewrap"><table><thead><tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+(c[0]==='total'||c[0]==='amount'?money(r[c[0]]):String(r[c[0]]??'—').replaceAll('<','&lt;'))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function itemEscape(value){
 return String(value??'—').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","'");
}
function listItems(){

 let cards=a.map((x,i)=>{
  let search=[x.name,x.code,x.qty,x.unit,x.purchase,x.price,x.wholesale,x.gst,x.minStock].join(' ').toLowerCase();
  return '<article class="product-card" data-item-card data-search="'+itemEscape(search)+'">'+
   '<div class="product-card-head"><div><h3>'+itemEscape(x.name)+'</h3><span class="product-sku">SKU / Barcode: '+itemEscape(x.code||'Not set')+'</span></div><span class="product-stock '+(num(x.qty)<=num(x.minStock)?'stock-low':'')+'">'+itemEscape(x.qty)+' '+itemEscape(x.unit||'pcs')+'</span></div>'+
   '<div class="product-detail-grid">'+
    '<div><small>Purchase price</small><strong>'+money(x.purchase)+'</strong></div>'+
    '<div><small>Retail price</small><strong>'+money(x.price)+'</strong></div>'+
    '<div><small>Wholesale price</small><strong>'+money(x.wholesale)+'</strong></div>'+
    '<div><small>GST rate</small><strong>'+itemEscape(num(x.gst))+'%</strong></div>'+
    '<div><small>Current stock</small><strong>'+itemEscape(x.qty)+' '+itemEscape(x.unit||'pcs')+'</strong></div>'+
    '<div><small>Reorder level</small><strong>'+itemEscape(x.minStock??0)+' '+itemEscape(x.unit||'pcs')+'</strong></div>'+
   '</div><div class="product-card-actions"><button class="btn soft" type="button" onclick="editItem('+i+')">✎ Edit item</button><button class="btn" type="button" onclick="adjustForm('+i+')">± Adjust stock</button><button class="btn danger" type="button" onclick="deleteItem('+i+')">Delete</button></div></article>';
 }).join('');
 $('#view').innerHTML='<div class="sectionhead"><div><h2>Items & inventory</h2><div class="muted">Product catalogue · '+a.length+' items</div></div><div class="actions"><button class="btn" onclick="bulkItemsForm()">＋ Bulk items</button><button class="btn soft" onclick="go(\'Stock Summary\')">Stock summary</button><button class="btn primary" onclick="itemForm()">＋ Add another product</button></div></div><input class="search" placeholder="Search item, SKU, barcode or price..." oninput="filterRows(this.value,\'itemrows\')"><div class="section product-card-grid" id="itemrows">'+(cards||'<div class="empty">No products added yet. Use Add item or Bulk items to begin.</div>')+'</div>';

function listParties(k){let a=get(k);$('#view').innerHTML='<div class="sectionhead"><div><h2>'+ (k==='customers'?'Customers':'Suppliers')+'</h2><div class="muted">Party directory and balances</div></div><button class="btn primary" onclick="partyForm(\''+k+'\')">＋ Add '+(k==='customers'?'customer':'supplier')+'</button></div><input class="search" placeholder="Search name or phone..." oninput="filterRows(this.value,\'partyrows\')"><div class="section tablewrap" id="partyrows"><table><thead><tr><th>Name</th><th>Phone</th><th>Address</th><th>Opening</th><th>Actions</th></tr></thead><tbody>'+a.map((x,i)=>'<tr><td>'+x.name+'</td><td>'+String(x.phone||'—')+'</td><td>'+String(x.address||'—')+'</td><td>'+money(x.opening)+'</td><td><button class="btn" onclick="editParty(\''+k+'\','+i+')">Edit</button> <button class="btn" onclick="contactParty('+JSON.stringify(String(x.phone||''))+')">Call / SMS</button> <button class="btn" onclick="deleteParty(\''+k+'\','+i+')">Delete</button></td></tr>').join('')+'</tbody></table></div>'}

function exportData(){
 const keys=Object.values(db),profileKeys=["bizname","bizaddress","bizphone","bizphone2","gstin","bizlogo","bizsignature"];
 const data={};
 keys.forEach(key=>{try{const value=JSON.parse(localStorage.getItem(key)||"[]");data[key]=value}catch(_){data[key]=[]}});
 const profile={address:localStorage.bizaddress||"",signature:localStorage.bizsignature||"",logo:localStorage.bizlogo||"",name:localStorage.bizname||"",phone:localStorage.bizphone||"",phone2:localStorage.bizphone2||"",gstin:localStorage.gstin||""};profileKeys.forEach(key=>{if(localStorage.getItem(key)!==null)profile[key]=localStorage.getItem(key)});
 const backup={app:"SmartLedger",schemaVersion:BACKUP_SCHEMA_VERSION,exportedAt:new Date().toISOString(),data,chartOfAccounts:JSON.parse(localStorage.getItem("sl_chart_accounts")||"[]"),accountJournals:JSON.parse(localStorage.getItem("sl_account_journals")||"[]"),profile};
 data["sl_chart_accounts"]=backup.chartOfAccounts;
 data["sl_account_journals"]=backup.accountJournals;
 const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="SmartLedger-Backup-"+today+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function restoreData(input){
 const file=input&&input.files&&input.files[0];if(!file)return;
 if(file.size>50*1024*1024){alert("Backup file is too large. Choose a file under 50 MB.");input.value="";return}
 const reader=new FileReader();
 reader.onerror=()=>{alert("Could not read the backup file.");input.value=""};
 reader.onload=()=>{
  let backup;try{backup=JSON.parse(String(reader.result||""))}catch(_){alert("This is not a valid SmartLedger JSON backup.");input.value="";return}
  const source=backup&&backup.data&&typeof backup.data==="object"?backup.data:backup;
  if(!source||typeof source!=="object"||Array.isArray(source)){alert("Backup structure is not supported.");input.value="";return}
  const mapping=Object.entries(db),prepared=[];
  for(const [name,key] of mapping){
   let value=source[key]!==undefined?source[key]:source[name];
   if(value!==undefined){if(!Array.isArray(value)){alert("Backup contains invalid data for "+name+". Nothing was restored.");input.value="";return}prepared.push([key,value])}
  }
  const chart=backup.chartOfAccounts??source.sl_chart_accounts, journals=backup.accountJournals??source.sl_account_journals;
  if(chart!==undefined&&!Array.isArray(chart)){alert("Backup chart of accounts is invalid. Nothing was restored.");input.value="";return}
  if(journals!==undefined&&!Array.isArray(journals)){alert("Backup journal entries are invalid. Nothing was restored.");input.value="";return}
  const profile=backup.profile&&typeof backup.profile==="object"?backup.profile:{};
  const profileKeys=["bizname","bizaddress","bizphone","bizphone2","gstin","bizlogo","bizsignature"];
  const hasData=prepared.length||chart!==undefined||journals!==undefined||profileKeys.some(key=>Object.prototype.hasOwnProperty.call(profile,key));
  if(!hasData){alert("No SmartLedger business data was found in this backup.");input.value="";return}
  if(!confirm("Restore this SmartLedger backup? Matching records on this device will be replaced. Export a backup of the current data first.")){input.value="";return}
  try{
   prepared.forEach(([key,value])=>localStorage.setItem(key,JSON.stringify(value)));
   if(chart!==undefined)localStorage.setItem("sl_chart_accounts",JSON.stringify(chart));
   if(journals!==undefined)localStorage.setItem("sl_account_journals",JSON.stringify(journals));
   profileKeys.forEach(key=>{if(Object.prototype.hasOwnProperty.call(profile,key))localStorage.setItem(key,String(profile[key]??""))});
   alert("Backup restored. SmartLedger will reload the saved business data.");location.reload();
  }catch(error){alert("Restore could not be completed: "+(error.message||"storage error"))}
  input.value="";
 };
 reader.readAsText(file);
}

function setTheme(mode){if(!['light','dark','system'].includes(mode))mode='light';localStorage.slTheme=mode;applyTheme();let x=document.getElementById('themechoice');if(x)x.value=mode}
function setAccent(c){localStorage.slAccent=c;applyTheme()}
function applyTheme(){
 let m=localStorage.slTheme||'light';
 let dark=m==='dark'||(m==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
 document.body.classList.remove('theme-dark','theme-light','theme-custom');
 document.body.classList.add(dark?'theme-dark':'theme-light');
 document.documentElement.style.colorScheme=dark?'dark':'light';
 document.documentElement.style.setProperty('--custom-accent',localStorage.slAccent||'#702b3a');
 document.querySelectorAll('.theme-switch button[data-theme-mode]').forEach(b=>{
  let selected=b.dataset.themeMode===m;
  b.classList.toggle('selected',selected);
  b.setAttribute('aria-pressed',selected?'true':'false');
 });
}
if(window.matchMedia){
 const appearanceQuery=window.matchMedia('(prefers-color-scheme: dark)');
 const onAppearanceChange=()=>{if((localStorage.slTheme||'light')==='system')applyTheme()};
 if(appearanceQuery.addEventListener)appearanceQuery.addEventListener('change',onAppearanceChange);
 else if(appearanceQuery.addListener)appearanceQuery.addListener(onAppearanceChange);
}

 const totalValue=rows.reduce((n,x)=>n+x.value,0),totalRetail=rows.reduce((n,x)=>n+x.retail,0),sold=rows.reduce((n,x)=>n+x.sold,0),low=rows.filter(x=>x.qty<=5).length;
 const tableRows=rows.map(x=>'<tr><td>'+String(x.name).replaceAll('<','&lt;')+'</td><td>'+x.sold+'</td><td>'+x.bought+'</td><td>'+x.qty+' '+x.unit+'</td><td>'+money(x.value)+'</td><td>'+money(x.margin)+'</td></tr>').join('');

function parseCSVRows(t){let rows=[],row=[],cell='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell.trim());cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell.trim());if(row.some(v=>v!==''))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell.trim());if(row.some(v=>v!==''))rows.push(row);return rows}
function saveBulkItems(){
 let f=$("#bulkfile")?.files?.[0];if(!f)return alert("Choose a spreadsheet file first");
 let ext=f.name.split(".").pop().toLowerCase();if(!["xls","xlsx","csv"].includes(ext))return alert("Choose .xls, .xlsx or .csv");
 let rd=new FileReader();rd.onerror=()=>alert("Could not read file");
 rd.onload=()=>{try{
  let rows;if(ext==="csv")rows=parseCSVRows(String(rd.result||""));else{if(!window.XLSX)throw Error("Excel reader did not load. Reopen the app with internet access or save as CSV.");let wb=XLSX.read(rd.result,{type:"array"});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""})}
  if(!rows.length)throw Error("The selected sheet is empty");
  const norm=v=>String(v??"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  const aliases={name:["item name","product name","item","product","name","description"],code:["sku barcode","sku","barcode","item code","product code"],qty:["quantity","opening stock","stock","qty","opening quantity"],unit:["unit","uom","measurement unit"],purchase:["purchase price","purchase rate","cost price","buying price","purchase"],price:["retail price","retail sale price","sale price","selling price","mrp","sales price"],wholesale:["wholesale price","wholesale rate","trade price"],hsn:["hsn","hsn code","hsn sac","hsn sac code"],gst:["gst","gst percent","gst rate","gst percentage","tax percent","tax rate"],minStock:["reorder level","minimum stock","min stock","low stock alert","reorder qty"]};
  let header=rows[0].map(norm),hasHeader=header.some(v=>Object.values(aliases).flat().includes(v)),col={};
  if(hasHeader)Object.entries(aliases).forEach(([key,names])=>col[key]=header.findIndex(v=>names.includes(v)));
  else col={name:0,code:1,qty:2,unit:3,purchase:4,price:5,wholesale:6,gst:7,minStock:8,hsn:9};
  if(hasHeader)rows.shift();
  const val=(row,key)=>col[key]!==undefined&&col[key]>=0?row[col[key]]:undefined;
  let a=get("items"),added=0,updated=0,skipped=0;
  rows.forEach(row=>{
   let name=String(val(row,"name")??"").trim(),code=String(val(row,"code")??"").trim(),q=val(row,"qty"),qty=q===""||q===undefined?0:num(q),unit=String(val(row,"unit")||"pcs").trim();
   let purchase=num(val(row,"purchase")),price=num(val(row,"price")),wholesale=num(val(row,"wholesale")),gst=num(val(row,"gst")),m=val(row,"minStock"),minStock=m===""||m===undefined?5:num(m),hsn=String(val(row,"hsn")??"").trim();
   if(!name||[qty,purchase,price,wholesale,gst,minStock].some(v=>!Number.isFinite(v)||v<0)){skipped++;return}
   let found=a.find(x=>(code&&String(x.code||"").toLowerCase()===code.toLowerCase())||String(x.name||"").toLowerCase()===name.toLowerCase());
   if(found){found.code=code||found.code||"";found.qty=qty;found.unit=unit;found.purchase=purchase;found.price=price;found.wholesale=wholesale;found.gst=gst;found.minStock=minStock;found.hsn=hsn||found.hsn||"";updated++}
   else{a.push({name,code,qty,unit,purchase,price,wholesale,gst,minStock,hsn});added++}
  });
  if(!added&&!updated)throw Error("No valid item rows found. Check headings and required Item Name field.");
  put("items",a);closeModal();render();alert(added+" new items imported; "+updated+" existing items updated; "+skipped+" rows skipped.");
 }catch(e){alert(e.message||"Import failed")}};

function consumeBatchStock(itemName,qty){let batches=get('batches'),sorted=batches.filter(b=>b.item===itemName&&num(b.remaining)>0).sort((a,b)=>(a.expiryDate||'9999-12-31').localeCompare(b.expiryDate||'9999-12-31')),left=qty,alloc=[];for(const b of sorted){if(left<=0)break;let take=Math.min(left,num(b.remaining));b.remaining=num(b.remaining)-take;left-=take;alloc.push({batchId:b.id,qty:take})}put('batches',batches);return alloc}
function saveTransaction(e,k){
 e.preventDefault();
 let sales=k==="sales",items=get("items"),lines=readTxnLines();
 if(!lines.length)return alert("Add at least one product");
 let quantities={};
 lines.forEach(x=>quantities[x.itemIndex]=(quantities[x.itemIndex]||0)+x.stockQty);
 for(let key in quantities){
  let p=items[Number(key)];
  if(lines.some(x=>x.itemIndex===Number(key)&&(!Number.isFinite(x.stockQty)||x.stockQty<=0)))return alert("Quantity and unit conversion must be valid");
  if(sales&&quantities[key]>num(p.qty)+1e-9)return alert("Insufficient stock for "+p.name+". Available: "+p.qty+" "+(p.unit||""));
 }
 let total=lines.reduce((s,x)=>s+x.total,0),taxable=lines.reduce((s,x)=>s+x.taxable,0),tax=lines.reduce((s,x)=>s+x.tax,0),cost=lines.reduce((s,x)=>s+x.cost,0),paid=num($("#tpaid").value),invoice=$("#tinvoice").value.trim(),party=$("#tparty").value,date=$("#tdate").value;
 if(!invoice)return alert("Enter an invoice / bill number");
 if(!date)return alert("Enter the transaction date");
 if(!sales&&lines.some(x=>x.expiryDate&&x.expiryDate<date))return alert("Expiry date cannot be earlier than the purchase date");
 if(!sales&&!party)return alert("Select a supplier");
 if(get(k).some(x=>String(x.invoice).toLowerCase()===invoice.toLowerCase()))return alert("This invoice / bill number already exists");
 if(paid<0)return alert("Paid amount cannot be negative");
 if(paid>total)return alert("Paid amount cannot exceed invoice total");
 let lastBalance=party?partyOutstanding(sales?"Customer":"Supplier",party):0,totalBalance=lastBalance+total,balanceDue=totalBalance-paid,id=Date.now(),batches=get("batches"),allAllocations=[];
 lines.forEach((x,index)=>{
  let p=items[x.itemIndex],stockQty=x.stockQty;
  if(sales){
   let allocations=consumeBatchStock(p.name,stockQty);
   x.batchAllocations=allocations;
   allAllocations.push(...allocations);
   p.qty=num(p.qty)-stockQty;
  }else{
   let factor=stockQty/Math.max(x.qty,1e-9),unitCost=x.rate/Math.max(factor,1e-9);
   p.purchase=(num(p.qty)*num(p.purchase)+stockQty*unitCost)/(num(p.qty)+stockQty||1);
   p.qty=num(p.qty)+stockQty;
   batches.push({id:"B"+id+"-"+(index+1),item:p.name,batchNo:x.batchNo||invoice+"-"+(index+1),expiryDate:x.expiryDate||"",receivedDate:date,qtyReceived:stockQty,remaining:stockQty,purchaseRate:unitCost,purchaseId:id});
  }
 });
 put("items",items);
 if(!sales)put("batches",batches);
 let record={id,date,invoice,party,item:lines.map(x=>x.item).join(", "),lines:lines.map(({itemIndex,...x})=>x),qty:lines.reduce((s,x)=>s+x.stockQty,0),taxable,tax,supplyType:$("#txnsupply").value,cgst:$("#txnsupply").value==="intra"?tax/2:0,sgst:$("#txnsupply").value==="intra"?tax/2:0,igst:$("#txnsupply").value==="inter"?tax:0,total,paid,method:$("#tmethod").value,cost,lastBalance,totalBalance,balanceDue,batchAllocations:allAllocations};
 let a=get(k);a.push(record);put(k,a);
 let cash=get("cash");
 if(paid>0)cash.push({date,type:sales?"Money In":"Money Out",method:record.method,note:(sales?"Sale ":"Purchase ")+record.invoice,amount:paid});
 put("cash",cash);
 closeModal();render();if(sales)showInvoice(record);
}

function returnEsc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function returnLinesFor(tx){

 return [{item:tx.item,qty,unit:tx.unit||"pcs",unitFactor:1,stockQty:qty,rate,discount,gstRate,tax:num(tx.tax),taxable,total:num(tx.total),cost:num(tx.cost),batchAllocations:tx.batchAllocations||[]}];

function saveReturn(e,kind){
 e.preventDefault();
 let sales=kind==="sales",id=Number($("#returntx").value),tx=get(sales?"sales":"purchases").find(x=>x.id===id),lineIndex=Number($("#returnline").value||0),qty=num($("#returnqty").value),rate=num($("#returnrate").value),date=$("#returndate").value,returns=get(sales?"salesReturns":"purchaseReturns");
 if(!tx||!date||qty<=0||rate<0)return alert("Enter valid return details");
 let lines=returnLinesFor(tx),line=lines[lineIndex];
 if(!line)return alert("Select a valid original invoice item");
 let already=sum(returns.filter(x=>String(x.originalId)===String(id)&&Number(x.lineIndex??0)===lineIndex),x=>x.qty);
 if(qty>num(line.qty)-already+1e-9)return alert("Return quantity exceeds the unreturned quantity for this item");
 let ratio=qty/Math.max(1e-9,num(line.qty)),stockQty=num(line.stockQty)>0?num(line.stockQty)*ratio:qty*(num(line.unitFactor)||1),discount=num(line.discount)*ratio,amount=Math.max(0,qty*rate-discount),gstRate=num(line.gstRate),tax=gstRate>0?amount*gstRate/100:num(line.tax)*ratio,cost=num(line.cost)*ratio;
 let cgst=tx.supplyType==="intra"?tax/2:(num(tx.cgst)&&num(tx.qty)>0?num(tx.cgst)*stockQty/num(tx.qty):0),sgst=tx.supplyType==="intra"?tax/2:(num(tx.sgst)&&num(tx.qty)>0?num(tx.sgst)*stockQty/num(tx.qty):0),igst=tx.supplyType==="inter"?tax:(num(tx.igst)&&num(tx.qty)>0?num(tx.igst)*stockQty/num(tx.qty):0);
 let items=get("items"),item=items.find(x=>x.name===line.item);
 if(!item)return alert("Original item no longer exists");

 if(sales){
  item.qty=num(item.qty)+stockQty;
  let allocations=Array.isArray(line.batchAllocations)?line.batchAllocations:(!Array.isArray(tx.lines)||!tx.lines.length?(tx.batchAllocations||[]):[]);
  if(allocations.length){
   let left=stockQty;
   for(const part of allocations){if(left<=1e-9)break;let b=batches.find(x=>x.id===part.batchId);if(b){let putBack=Math.min(left,num(part.qty));b.remaining=num(b.remaining)+putBack;left-=putBack}}
   if(left>1e-9)batches.push({id:"BR"+Date.now(),item:item.name,batchNo:"SALES-RETURN",expiryDate:"",receivedDate:date,qtyReceived:left,remaining:left,purchaseRate:cost/Math.max(stockQty,1e-9),purchaseId:null});
  }else batches.push({id:"BR"+Date.now(),item:item.name,batchNo:"SALES-RETURN-"+(lineIndex+1),expiryDate:"",receivedDate:date,qtyReceived:stockQty,remaining:stockQty,purchaseRate:cost/Math.max(stockQty,1e-9),purchaseId:null});
 }else{
  if(stockQty>num(item.qty)+1e-9)return alert("Cannot return more stock than currently available");
  let originalBatches=batches.filter(x=>x.item===item.name&&String(x.purchaseId)===String(tx.id)),left=stockQty;
  for(const b of originalBatches.slice().sort((a,b)=>(a.expiryDate||"9999").localeCompare(b.expiryDate||"9999"))){let take=Math.min(left,num(b.remaining));b.remaining-=take;left-=take;if(left<=1e-9)break}

 let record={id:Date.now()*1000+Math.floor(Math.random()*1000),originalId:id,lineIndex,invoice:tx.invoice,date,item:line.item,party:tx.party,qty,stockQty,unit:line.unit||item.unit||"pcs",unitFactor:num(line.unitFactor)||stockQty/Math.max(qty,1e-9),rate,amount,tax,cgst,sgst,igst,cost,kind:sales?"Sales return":"Purchase return"};
 returns.push(record);put(sales?"salesReturns":"purchaseReturns",returns);

 closeModal();render();alert((sales?"Sales":"Purchase")+" return saved. Stock and tax updated.");
}

function amountInWordsINR(value){
 let n=Math.round((num(value)+Number.EPSILON)*100)/100,rupees=Math.floor(n),paise=Math.round((n-rupees)*100);

<script>
/* Attach semantic labels so every data table can become readable invoice/record cards on phones. */
(function(){
 function labelTables(root){
  if(!root||!root.querySelectorAll)return;
  root.querySelectorAll('#view .tablewrap:not(#itemrows) table, #modalbody .tablewrap table').forEach(table=>{
   const heads=Array.from(table.querySelectorAll(':scope > thead > tr:last-child > th')).map(th=>th.textContent.trim().replace(/\\s+/g,' '));
   if(!heads.length)return;
   table.querySelectorAll(':scope > tbody > tr').forEach(row=>{
    Array.from(row.cells).forEach((cell,index)=>{
     if(cell.hasAttribute('colspan'))return;
     if(!cell.hasAttribute('data-label')&&heads[index])cell.setAttribute('data-label',heads[index]);
    });
   });
  });
 }
 const run=()=>labelTables(document);
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
 const target=document.getElementById('view');
 if(target)new MutationObserver(()=>labelTables(document)).observe(target,{childList:true,subtree:true});
 const modalBody=document.getElementById('modalbody');
 if(modalBody)new MutationObserver(()=>labelTables(document)).observe(modalBody,{childList:true,subtree:true});
 window.addEventListener('resize',run,{passive:true});
})();
</script>
