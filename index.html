/* v12.0: fixed app shell; each workspace owns its scroll position */
html,body{height:100%;min-height:100%;overflow:hidden}
.app{height:100dvh;min-height:0;overflow:hidden}
.side{height:100dvh;overscroll-behavior:contain}
.main{height:100dvh;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.top{flex:0 0 auto}
.content{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;scrollbar-gutter:stable}
.modal{overscroll-behavior:contain}
.dialog{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
@media(max-width:850px){.main{height:100dvh;padding-top:62px}.content{min-height:0;padding-bottom:calc(82px + env(safe-area-inset-bottom))}.side{height:62px}}
@media(max-width:520px){.main{padding-top:62px}.content{padding-bottom:calc(82px + env(safe-area-inset-bottom))}}
/* v12 section shortcuts: compact grid, no horizontal tab strip */
.section-quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;overflow:visible;padding:3px 0 12px;margin:0 0 12px}
.section-quick button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:42px;white-space:normal;text-align:center;padding:9px 10px;border-radius:12px}
.section-quick button.section-more{background:linear-gradient(145deg,#f2e5e1,#e7d4d0);border-color:#d7bdb8;font-weight:800}
.section-quick button.section-more .more-mark{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:#702b3a;color:white;font-size:14px}
.section-action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.section-action-grid .more-link{min-height:68px}
@media(min-width:700px){.section-quick{grid-template-columns:repeat(4,minmax(0,1fr))}.section-action-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

  return label+'<polygon points="'+x+','+y+' '+(x+side)+','+(y-6)+' '+(x+side+22)+','+(y-6)+' '+(x+22)+','+y+'" class="bar-top"/><polygon points="'+(x+22)+','+y+' '+(x+side+22)+','+(y-6)+' '+(x+side+22)+',105 '+(x+22)+',111" class="bar-side"/><rect x="'+x+'" y="'+y+'" width="22" height="'+(105-y)+'" rx="3" class="bar-front"/><text x="'+(x+16)+'" y="132" text-anchor="middle" class="chart-day">'+p.label+'</text>';
 }).join('');
 return '<svg class="sales-chart" viewBox="0 0 360 150" role="img" aria-label="Three-dimensional daily sales bar chart for the last seven days"><path d="M8 111H352" class="chart-base"/>'+bars+'</svg>';

function parseCSVRows(t){let rows=[],row=[],cell='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell.trim());cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell.trim());if(row.some(v=>v!==''))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell.trim());if(row.some(v=>v!==''))rows.push(row);return rows}

  let header=rows[0].map(norm),hasHeader=header.some(v=>Object.values(aliases).flat().includes(v)),col={};

  else col={name:0,code:1,qty:2,unit:3,purchase:4,price:5,wholesale:6,gst:7,minStock:8,hsn:9};
  if(hasHeader)rows.shift();

   let purchase=num(val(row,"purchase")),price=num(val(row,"price")),wholesale=num(val(row,"wholesale")),gst=num(val(row,"gst")),m=val(row,"minStock"),minStock=m===""||m===undefined?5:num(m),hsn=String(val(row,"hsn")??"").trim();
   if(!name||[qty,purchase,price,wholesale,gst,minStock].some(v=>!Number.isFinite(v)||v<0)){skipped++;return}
   let found=a.find(x=>(code&&String(x.code||"").toLowerCase()===code.toLowerCase())||String(x.name||"").toLowerCase()===name.toLowerCase());
   if(found){found.code=code||found.code||"";found.qty=qty;found.unit=unit;found.purchase=purchase;found.price=price;found.wholesale=wholesale;found.gst=gst;found.minStock=minStock;found.hsn=hsn||found.hsn||"";updated++}

 }catch(e){alert(e.message||"Import failed")}};

function transactionForm(k){let sales=k==='sales',items=get('items'),parties=get(sales?'customers':'suppliers');modal(sales?'New sale invoice':'New purchase bill','<form onsubmit="saveTransaction(event,\''+k+'\')"><div class="formgrid">'+field('Date','tdate','date','value="'+today+'"')+field('Invoice / bill number','tinvoice','text','value="'+(sales?'SL-':'PB-')+Date.now().toString().slice(-6)+'"')+'<div class="field"><label>'+(sales?'Customer':'Supplier')+'</label><select id="tparty"><option>Walk-in</option>'+parties.map(p=>'<option>'+p.name.replaceAll('"','&quot;')+'</option>').join('')+'</select></div><div class="field"><label>Item</label><select id="titem" onchange="setRate()"><option value="">Select item</option>'+items.map((p,i)=>'<option value="'+i+'">'+p.name.replaceAll('"','&quot;')+'</option>').join('')+'</select></div>'+field('Quantity','tqty','number','step="any" value="1" oninput="calcTotal()"')+field(sales?'Sale rate (₹)':'Purchase rate (₹)','trate','number','step="any" value="0" oninput="calcTotal()"')+field('Discount (₹)','tdiscount','number','step="any" value="0" oninput="calcTotal()"')+'<div class="field"><label>GST rate (%)</label><select id="tgst" onchange="calcTotal()"><option value="0">0%</option><option value="5">5%</option><option value="12">12%</option><option value="18">18%</option><option value="28">28%</option></select></div>'+(sales?'':field('Batch / lot number','tbatch')+field('Expiry date','texpiry','date'))+field('Amount paid (₹)','tpaid','number','step="any" value="0"')+'<div class="field"><label>Taxable value</label><input id="ttaxable" value="0" readonly></div><div class="field"><label>GST amount</label><input id="ttax" value="0" readonly></div><div class="field"><label>Invoice total</label><input id="ttotal" value="0" readonly></div><div class="field"><label>Payment mode</label><select id="tmethod"><option>Cash</option><option>UPI</option><option>Bank</option><option>Credit</option></select></div></div><p><button class="btn primary">Save '+(sales?'sale':'purchase')+'</button></p></form>');window.currentTxn=k}
function setRate(){let i=get('items')[$('#titem').value];$('#trate').value=i?(window.currentTxn==='sales'?i.price:i.purchase):0;if($('#tgst'))$('#tgst').value=i?(i.gst||0):0;calcTotal()}
function calcTotal(){let taxable=Math.max(0,num($('#tqty').value)*num($('#trate').value)-num($('#tdiscount').value)),tax=taxable*num($('#tgst')?.value)/100;$('#ttaxable').value=taxable.toFixed(2);$('#ttax').value=tax.toFixed(2);$('#ttotal').value=(taxable+tax).toFixed(2)}
function consumeBatchStock(itemName,qty){let batches=get('batches'),sorted=batches.filter(b=>b.item===itemName&&num(b.remaining)>0).sort((a,b)=>(a.expiryDate||'9999-12-31').localeCompare(b.expiryDate||'9999-12-31')),left=qty,alloc=[];for(const b of sorted){if(left<=0)break;let take=Math.min(left,num(b.remaining));b.remaining=num(b.remaining)-take;left-=take;alloc.push({batchId:b.id,qty:take})}put('batches',batches);return alloc}
function saveTransaction(e,k){e.preventDefault();let sales=k==='sales',items=get('items'),idx=$('#titem').value,item=items[idx];if(!item)return alert('Select an item');let qty=num($('#tqty').value),total=num($('#ttotal').value),paid=num($('#tpaid').value);if(qty<=0||paid<0||paid>total)return alert('Check quantity and paid amount');if(sales&&qty>item.qty)return alert('Insufficient stock. Available: '+item.qty);if(!sales&&$('#texpiry').value&&$('#texpiry').value<$('#tdate').value)return alert('Expiry date cannot be earlier than the purchase date');let id=Date.now(),taxable=num($('#ttaxable').value),tax=num($('#ttax').value),batchAllocations=[];if(sales){item.qty-=qty;batchAllocations=consumeBatchStock(item.name,qty)}else{item.qty+=qty;let batches=get('batches');batches.push({id:'B'+id,item:item.name,batchNo:$('#tbatch').value.trim()||('AUTO-'+id),expiryDate:$('#texpiry').value||'',receivedDate:$('#tdate').value,qtyReceived:qty,remaining:qty,purchaseRate:num($('#trate').value),purchaseId:id});put('batches',batches)}put('items',items);let a=get(k);a.push({id,date:$('#tdate').value,invoice:$('#tinvoice').value,party:$('#tparty').value,item:item.name,qty,rate:num($('#trate').value),discount:num($('#tdiscount').value),gstRate:num($('#tgst').value),taxable,tax,total,paid,method:$('#tmethod').value,cost:qty*item.purchase,batchNo:sales?'':($('#tbatch').value.trim()||('AUTO-'+id)),expiryDate:sales?'':($('#texpiry').value||''),batchAllocations});put(k,a);let cash=get('cash');if(paid>0)cash.push({date:$('#tdate').value,type:'Money '+(sales?'In':'Out'),method:$('#tmethod').value,note:(sales?'Sale ':'Purchase ')+$('#tinvoice').value,amount:paid});put('cash',cash);closeModal();render();if(sales)showInvoice(a[a.length-1])}
function batchExpiryPage(){let rows=get('batches'),now=today,limit=new Date(Date.now()+30*86400000).toISOString().slice(0,10),active=rows.filter(x=>num(x.remaining)>0),expired=active.filter(x=>x.expiryDate&&x.expiryDate<now),soon=active.filter(x=>x.expiryDate&&x.expiryDate>=now&&x.expiryDate<=limit);$('#view').innerHTML='<div class="welcome"><div><h1>Batch & expiry</h1><div class="muted">Batch balances and expiry monitoring</div></div></div><div class="grid"><div class="card"><div class="statlabel">Active batches</div><div class="stat">'+active.length+'</div></div><div class="card"><div class="statlabel">Expired batches</div><div class="stat">'+expired.length+'</div></div><div class="card"><div class="statlabel">Expiring in 30 days</div><div class="stat">'+soon.length+'</div></div></div><div class="section card"><h2>Batch register</h2>'+table(active.sort((a,b)=>(a.expiryDate||'9999').localeCompare(b.expiryDate||'9999')), [['item','Item'],['batchNo','Batch / lot'],['expiryDate','Expiry'],['receivedDate','Received'],['remaining','Remaining qty'],['purchaseRate','Purchase rate']])+'</div><div class="notice">Batch balances begin tracking from purchases recorded in v13. Existing opening stock remains unbatched until you record a purchase or use stock adjustment.</div>'}
function returnForm(kind){let sales=kind==='sales',tx=get(sales?'sales':'purchases');if(!tx.length)return alert('No '+(sales?'sales invoices':'purchase bills')+' found to return');modal(sales?'Sales return':'Purchase return','<form onsubmit="saveReturn(event,\''+kind+'\')"><div class="formgrid"><div class="field"><label>Original '+(sales?'invoice':'purchase bill')+'</label><select id="returntx" onchange="setReturnMax()">'+tx.slice().reverse().map(x=>'<option value="'+x.id+'">'+x.invoice+' · '+x.item+' · '+x.qty+' qty · '+x.party+'</option>').join('')+'</select></div>'+field('Return quantity','returnqty','number','step="any" min="0.001"')+field('Return rate (₹)','returnrate','number','step="any" min="0"')+field('Date','returndate','date','value="'+today+'"')+'</div><p class="muted" id="returnhint">Quantity is limited to the unreturned quantity on the original transaction.</p><p><button class="btn primary">Save return</button></p></form>');window.returnKind=kind;setReturnMax()}
function setReturnMax(){let kind=window.returnKind||'sales',sales=kind==='sales',id=Number($('#returntx')?.value),tx=get(sales?'sales':'purchases').find(x=>x.id===id);if(!tx)return;let returned=sum(get(sales?'salesReturns':'purchaseReturns').filter(x=>x.originalId===id),x=>x.qty);$('#returnqty').max=Math.max(0,num(tx.qty)-returned);$('#returnqty').value=$('#returnqty').max;$('#returnrate').value=tx.rate;$('#returnhint').textContent='Maximum returnable quantity: '+$('#returnqty').max+' · Original '+tx.invoice}
function saveReturn(e,kind){e.preventDefault();let sales=kind==='sales',id=Number($('#returntx').value),tx=get(sales?'sales':'purchases').find(x=>x.id===id),qty=num($('#returnqty').value),rate=num($('#returnrate').value),date=$('#returndate').value,returns=get(sales?'salesReturns':'purchaseReturns');if(!tx||qty<=0||rate<0||!date)return alert('Enter valid return details');let already=sum(returns.filter(x=>x.originalId===id),x=>x.qty);if(qty>num(tx.qty)-already)return alert('Return quantity exceeds the unreturned quantity');let items=get('items'),item=items.find(x=>x.name===tx.item);if(!item)return alert('Original item no longer exists');let amount=qty*rate;if(sales){item.qty+=qty;let batches=get('batches'),alloc=tx.batchAllocations||[];if(alloc.length){let left=qty;for(const part of alloc){if(left<=0)break;let b=batches.find(x=>x.id===part.batchId);if(b){let putBack=Math.min(left,num(part.qty));b.remaining=num(b.remaining)+putBack;left-=putBack}}if(left>0)batches.push({id:'BR'+Date.now(),item:item.name,batchNo:'SALES-RETURN',expiryDate:'',receivedDate:date,qtyReceived:left,remaining:left,purchaseRate:num(tx.cost)/Math.max(1,num(tx.qty)),purchaseId:null})}else batches.push({id:'BR'+Date.now(),item:item.name,batchNo:'SALES-RETURN',expiryDate:'',receivedDate:date,qtyReceived:qty,remaining:qty,purchaseRate:num(tx.cost)/Math.max(1,num(tx.qty)),purchaseId:null});put('batches',batches)}else{if(qty>item.qty)return alert('Cannot return more stock than currently available');item.qty-=qty;let batches=get('batches'),left=qty;for(const b of batches.filter(x=>x.item===item.name&&x.purchaseId===tx.id).sort((a,b)=>(a.expiryDate||'9999').localeCompare(b.expiryDate||'9999'))){let take=Math.min(left,num(b.remaining));b.remaining-=take;left-=take;if(left<=0)break}put('batches',batches)}put('items',items);returns.push({id:Date.now(),originalId:id,invoice:tx.invoice,date,item:tx.item,party:tx.party,qty,rate,amount,kind:sales?'Sales return':'Purchase return'});put(sales?'salesReturns':'purchaseReturns',returns);let cash=get('cash');cash.push({date,type:sales?'Money Out':'Money In',method:'Cash',note:(sales?'Sales return ':'Purchase return ')+tx.invoice,amount});put('cash',cash);closeModal();render();alert((sales?'Sales':'Purchase')+' return saved. Stock updated.')}

let scanStream=null,scanActive=false;
async function scanBarcode(){if(!('BarcodeDetector'in window))return alert('Barcode scanning is not supported by this browser. Use current Chrome or enter the barcode manually.');try{let detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});let video=document.createElement('video');video.setAttribute('playsinline','');video.style.cssText='width:100%;max-height:220px;background:#111;border-radius:10px';video.srcObject=scanStream;await video.play();modal('Scan product barcode','<div id="scanbox"></div><p class="muted">Point the rear camera at the barcode.</p><button type="button" class="btn" onclick="stopScanner()">Cancel</button>');$('#scanbox').appendChild(video);scanActive=true;let loop=async()=>{if(!scanActive)return;try{let codes=await detector.detect(video);if(codes.length){let code=codes[0].rawValue,idx=get('items').findIndex(x=>x.code===code);stopScanner();closeModal();if(idx<0)alert('No item found for barcode '+code);else{$('#titem').value=String(idx);setRate()}return}}catch(e){}requestAnimationFrame(loop)};requestAnimationFrame(loop)}catch(e){alert('Camera access failed. Allow camera permission and use HTTPS.')}}

function restoreData(input){
 let f=input.files&&input.files[0];if(!f)return;
 const reset=()=>{input.value=""};
 if(f.size>10*1024*1024){alert("Backup file is larger than 10 MB.");reset();return}
 let reader=new FileReader();
 reader.onerror=()=>{alert("Could not read this backup file.");reset()};
 reader.onload=()=>{
  try{
   let data=JSON.parse(reader.result);
   if(!data||typeof data!=="object"||Array.isArray(data))throw new Error("Invalid backup structure");
   if(data.app&&data.app!=="SmartLedger")throw new Error("This backup belongs to a different application");
   if(data.schemaVersion!==undefined&&(!Number.isInteger(data.schemaVersion)||data.schemaVersion<1||data.schemaVersion>BACKUP_SCHEMA_VERSION))throw new Error("Unsupported backup version");
   let keys=Object.keys(db),optional=['batches','salesReturns','purchaseReturns'];
   if(!keys.filter(k=>!optional.includes(k)).every(k=>Array.isArray(data[k])))throw new Error("This is not a complete SmartLedger backup");
   optional.forEach(k=>{if(!Array.isArray(data[k]))data[k]=[]});
   if(data.profile!==undefined&&(!data.profile||typeof data.profile!=="object"||Array.isArray(data.profile)))throw new Error("Invalid business profile");
   if(!confirm("Restore this backup? This will replace all SmartLedger records currently stored in this browser. A copy of your current records will be downloaded first.")){reset();return}
   exportData();
   keys.forEach(k=>put(k,data[k]));
   if(data.profile){
    localStorage.bizname=String(data.profile.name||"");
    localStorage.bizphone=String(data.profile.phone||"");
    localStorage.gstin=String(data.profile.gstin||"");
    localStorage.bizaddress=String(data.profile.address||"");
    localStorage.bizphone2=String(data.profile.phone2||"");
    localStorage.bizlogo=String(data.profile.logo||"");
    localStorage.bizsignature=String(data.profile.signature||"");
   }
   alert("Backup restored successfully.");
   render();
  }catch(error){const known=["Invalid backup structure","This backup belongs to a different application","Unsupported backup version","This is not a complete SmartLedger backup","Invalid business profile"];alert(known.includes(error.message)?error.message+". No data was changed.":"Invalid or unreadable backup. No data was changed.")}
  reset();
 };
 reader.readAsText(f);
}

 $("#view").innerHTML="<div class=\"welcome\"><div><h1>Reports & analytics</h1><div class=\"muted\">Figures calculated from saved entries on this device</div></div><button class=\"btn\" onclick=\"exportData()\">↓ Export backup</button></div><div class=\"grid\"><div class=\"card\"><div class=\"statlabel\">Sales</div><div class=\"stat\">"+money(t.sales)+"</div></div><div class=\"card\"><div class=\"statlabel\">Purchases</div><div class=\"stat\">"+money(t.purchases)+"</div></div><div class=\"card\"><div class=\"statlabel\">Gross profit estimate</div><div class=\"stat\">"+money(gross)+"</div></div><div class=\"card\"><div class=\"statlabel\">Expenses</div><div class=\"stat\">"+money(expense)+"</div></div><div class=\"card\"><div class=\"statlabel\">Net profit estimate</div><div class=\"stat\">"+money(gross-expense)+"</div></div><div class=\"card\"><div class=\"statlabel\">Customer receivables</div><div class=\"stat\">"+money(outstandingTotal("Customer"))+"</div></div><div class=\"card\"><div class=\"statlabel\">Supplier payables</div><div class=\"stat\">"+money(outstandingTotal("Supplier"))+"</div></div><div class=\"card\"><div class=\"statlabel\">Closing stock value</div><div class=\"stat\">"+money(t.stock)+"</div></div></div><div class=\"section card\"><h2>Profit calculation</h2><p>Gross profit = recorded taxable sales less recorded cost of goods sold.</p><p>Net profit estimate = gross profit less recorded expenses.</p><div class=\"notice\">Opening stock costs, unrecorded bills, tax adjustments and expense allocations can affect actual profit. Do not use this estimate as a statutory financial statement.</div></div>";
}


function taxReports(){
 let sales=get("sales"),purchases=get("purchases"),output=sales.reduce((s,x)=>s+num(x.tax),0),input=purchases.reduce((s,x)=>s+num(x.tax),0),cgst=sales.reduce((s,x)=>s+num(x.cgst),0),sgst=sales.reduce((s,x)=>s+num(x.sgst),0),igst=sales.reduce((s,x)=>s+num(x.igst),0),taxable=sales.reduce((s,x)=>s+num(x.taxable??x.total),0);
 $("#view").innerHTML="<div class=\"welcome\"><div><h1>GST reports</h1><div class=\"muted\">Summary of tax entered on invoices and purchase bills</div></div><button class=\"btn\" onclick=\"printTaxReport()\">Print report</button></div><div class=\"grid\"><div class=\"card\"><div class=\"statlabel\">Taxable sales</div><div class=\"stat\">"+money(taxable)+"</div></div><div class=\"card\"><div class=\"statlabel\">Output GST</div><div class=\"stat\">"+money(output)+"</div></div><div class=\"card\"><div class=\"statlabel\">Input GST recorded</div><div class=\"stat\">"+money(input)+"</div></div><div class=\"card\"><div class=\"statlabel\">Net GST estimate</div><div class=\"stat\">"+money(output-input)+"</div></div></div><div class=\"section card\"><h2>Output tax split</h2><p>CGST: <b>"+money(cgst)+"</b></p><p>SGST: <b>"+money(sgst)+"</b></p><p>IGST: <b>"+money(igst)+"</b></p></div><div class=\"section\"><h2>Sales invoices</h2>"+table(sales,[["date","Date"],["invoice","Invoice"],["party","Customer"],["taxable","Taxable"],["cgst","CGST"],["sgst","SGST"],["igst","IGST"],["tax","Total GST"],["total","Invoice total"]])+"</div><div class=\"notice\">Management estimate only. Confirm GST registration, HSN/SAC, place of supply, exemptions, tax rates, credit eligibility and statutory return figures before filing. Older invoices may not contain a CGST/SGST/IGST split.</div>";
}


let txnScanStream=null,txnScanActive=false;
async function scanTxnLine(button){
 let row=button.closest(".txnline");if(!row)return;
 if(!("BarcodeDetector" in window))return alert("Barcode scan is not supported in this browser. Enter the barcode in the product list manually.");
 try{
  let detector=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39","qr_code"]});
  txnScanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
  let video=document.createElement("video");video.setAttribute("playsinline","");video.style.cssText="width:100%;max-height:180px;background:#111;border-radius:8px;margin-top:8px";
  video.srcObject=txnScanStream;await video.play();button.insertAdjacentElement("afterend",video);txnScanActive=true;button.textContent="Scanning…";
  let scan=async()=>{if(!txnScanActive)return;try{let found=await detector.detect(video);if(found.length){let code=found[0].rawValue,index=get("items").findIndex(x=>String(x.code)===String(code));stopTxnScan();if(index<0)alert("No product matches barcode "+code);else{let select=row.querySelector(".txitem");select.value=String(index);txnRate(select)}return}}catch(e){}requestAnimationFrame(scan)};requestAnimationFrame(scan);
 }catch(e){stopTxnScan();alert("Camera access failed. Allow camera permission and use the app over HTTPS.")}
}
function stopTxnScan(){txnScanActive=false;if(txnScanStream)txnScanStream.getTracks().forEach(t=>t.stop());txnScanStream=null;document.querySelectorAll(".txnline video").forEach(v=>v.remove());document.querySelectorAll(".txnline button").forEach(b=>{if(b.textContent==="Scanning…")b.textContent="▣ Scan barcode"})}

</script></body></html>
