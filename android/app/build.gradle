plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation files('libs/tesseract4android-openmp-release.aar')
    implementation 'androidx.annotation:annotation:1.3.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

android {
    namespace 'com.smartledger.business'
    compileSdk 35

    defaultConfig {
        applicationId 'com.smartledger.business'
        minSdk 23
        targetSdk 35
        versionCode 79
        versionName '79.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('SMARTLEDGER_KEYSTORE_PATH')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('SMARTLEDGER_STORE_PASSWORD')
                keyAlias System.getenv('SMARTLEDGER_KEY_ALIAS')
                keyPassword System.getenv('SMARTLEDGER_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('SMARTLEDGER_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }

    androidResources { noCompress += 'traineddata' }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
